          package com.music.bitchord.playback.smart

          /**
           * What the sink-side renderer's mix looks like to everything that is not the
           * renderer: the controller (when to start the incoming player, when the app
           * moves to the new song, where the scrubber is) and the session (where the
           * outgoing sink takes over). Both [LoopMix.Clock] and [OverlapMix.Clock] are one,
           * so one controller path can run either kind of mix.
           *
           * Every time is mix seconds, 0 being the moment the outgoing song reaches
           * [takeoverSeconds] and the sink crosses over to the renderer.
           */
          interface MixTimeline {
              /** Track second of the outgoing song at mix t0: where the sink splices. */
              val takeoverSeconds: Double

              /** Beat k of the mix, seconds after t0; at least two entries. Drives the scrubber's pulse only. */
              val beatTimes: DoubleArray

              /** The app moves to the incoming song here. */
              val handoffAt: Double

              /** The outgoing deck is done being the main sound here. */
              val releaseAt: Double

              /** The incoming player takes over here, at track second [elementTrackTime]. */
              val elementAt: Double
              val elementTrackTime: Double

              /** The beat [t] falls in and how far through it (0..1); k = -1 before t0. */
              fun beatAt(t: Double): Pair<Int, Double>

              /** Where [side]'s song is [t] seconds after t0, or null where it isn't sounding from a deck. */
              fun positionAt(side: LoopMix.Side, t: Double): Double?
          }
          KT_EOF
          mkdir -p "$(dirname 'shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/OverlapMix.kt')"
          cat > 'shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/OverlapMix.kt' <<'KT_EOF'
          package com.music.bitchord.playback.smart

          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.sin

          /**
           * A transition that is not a loop mix, rendered by the same native renderer
           * instead of two players and volume ramps: the outgoing song hands over to a
           * deck a few seconds before the move, the incoming song runs on its own deck,
           * and the renderer does the gain (equal power), and the echo, on one clock.
           *
           * This first cut covers the [CutGesture]s the planner picks for pairs it cannot
           * beatmatch. Both decks play at rate 1 (no stretch), so the mix is the music
           * exactly as it is, with sample-exact edges.
           *
           * Pure: reads a [TransitionPlan] and two analyses, returns a [Plan], and lays
           * it out as a [Clock] and the renderer's gain curves. No audio, no players.
           */
          object OverlapMix {
              /** Master switch. Off: every cut stays on the planner's two-player path, exactly as before. */
              var enabled: Boolean = false

              /** Seconds of outgoing music the renderer plays before the move starts, so the splice is long settled. */
              const val TAKEOVER_LEAD_SECONDS = 4.0

              /** Seconds after the move ends before the incoming player takes over from its deck (it needs time to align). */
              const val SETTLE_SECONDS = 3.0

              /** The takeover can't be earlier than this into the outgoing song. */
              const val MIN_TAKEOVER_SECONDS = 1.0

              /** Music that must remain in the incoming song after the handover. */
              const val CLEARANCE_SECONDS = 5.0

              /** Seconds the echo's send ramps up over at the start of an echo-out, in beats. */
              private const val ECHO_RAMP_BEATS = 1.0

              /** How fast the echo send closes at the end of the overlap. */
              private const val ECHO_CLOSE_SECONDS = 0.05

              /** Echo feedback: five repeats later (see [echoTailSeconds]) it is about -30 dB. */
              const val ECHO_FEEDBACK = 0.5f
              const val ECHO_RETURN = 0.8f

              private const val FADE_POINTS = 8
              private const val MAX_BEATS = 512

              data class Plan(
                  val gesture: CutGesture,
                  /** Outgoing track second at mix t0. */
                  val takeover: Double,
                  /** Mix seconds at which the move starts and ends. */
                  val cutStart: Double,
                  val cutEnd: Double,
                  /** Incoming track second at mix [cutStart]. */
                  val inCue: Double,
                  /** Seconds per beat of each song, for the scrubber's pulse. */
                  val outBeat: Double,
                  val inBeat: Double,
                  /** Echo delay in seconds; 0 for no echo. */
                  val echoSeconds: Double,
                  /** Seconds the echo keeps ringing after [cutEnd]. */
                  val tail: Double,
              ) {
                  val echo: Boolean get() = echoSeconds > 0.0
              }

              /** A piecewise-linear curve over mix seconds, as the renderer takes it. */
              class Curve(val times: DoubleArray, val values: FloatArray)

              /**
               * The overlap mix for a cut the planner already chose ([plan]'s reason is a
               * [CutGesture]'s), or null when the cut does not fit the renderer: the move
               * starts too early in the song to take over before it, the echo's tail would
               * run past the file, or too little of the incoming song is left.
               */
              fun fromCut(
                  plan: TransitionPlan,
                  analysis: TrackAnalysis,
                  nextAnalysis: TrackAnalysis,
                  length: Double,
                  nextLength: Double,
              ): Plan? {
                  if (!enabled || plan.blocked) return null
                  val gesture = when (plan.reason.removePrefix("before-")) {
                      CutGesture.QUICK_CUT.reason -> CutGesture.QUICK_CUT
                      CutGesture.DROP_CUT.reason -> CutGesture.DROP_CUT
                      CutGesture.ECHO_CUT.reason -> CutGesture.ECHO_CUT
                      else -> return null
                  }
                  val takeover = plan.transitionStart - TAKEOVER_LEAD_SECONDS
                  if (takeover < MIN_TAKEOVER_SECONDS) return null
                  val cutStart = TAKEOVER_LEAD_SECONDS
                  val cutEnd = plan.transitionEnd - takeover
                  if (cutEnd <= cutStart) return null
                  val echo = if (gesture == CutGesture.ECHO_CUT) plan.echoSeconds.orZero() else 0.0
                  val tail = if (echo > 0.0) echoTailSeconds(echo) else 0.0
                  if (length > 0.0 && takeover + cutEnd + tail > length - 0.25) return null
                  val inCue = plan.incomingCueTime
                  if (!inCue.isFinite() || inCue < 0.0) return null
                  val handoverTrack = inCue + (cutEnd + SETTLE_SECONDS - cutStart)
                  if (nextLength > 0.0 && handoverTrack > nextLength - CLEARANCE_SECONDS) return null
                  return Plan(
                      gesture = gesture,
                      takeover = takeover,
                      cutStart = cutStart,
                      cutEnd = cutEnd,
                      inCue = inCue,
                      outBeat = beatOf(plan.beatSeconds, analysis),
                      inBeat = beatOf(0.0, nextAnalysis),
                      echoSeconds = echo,
                      tail = tail,
                  )
              }

              private fun beatOf(given: Double, analysis: TrackAnalysis): Double {
                  if (given > 0.0) return given
                  val interval = analysis.beatInterval.orZero()
                  if (interval > 0.0) return interval
                  val bpm = analysis.bpm.orZero()
                  return if (bpm > 0.0) 60.0 / bpm else 0.5
              }

              // ---- The renderer's curves -----------------------------------------------------------------

              /** The outgoing deck's gain: joins the song at t0 (over the sink's own [handover]), then an equal-power fall. */
              fun outGain(plan: Plan, handover: Double): Curve {
                  val times = ArrayList<Double>()
                  val values = ArrayList<Float>()
                  times += -handover; values += 0f
                  times += 0.0; values += 1f
                  times += plan.cutStart; values += 1f
                  for (i in 1..FADE_POINTS) {
                      val f = i.toDouble() / FADE_POINTS
                      times += plan.cutStart + (plan.cutEnd - plan.cutStart) * f
                      values += if (i == FADE_POINTS) 0f else cos(PI / 2 * f).toFloat()
                  }
                  return Curve(times.toDoubleArray(), values.toFloatArray())
              }

              /** The incoming deck's gain: silent until the move, an equal-power rise, then full. */
              fun inGain(plan: Plan): Curve {
                  val times = ArrayList<Double>()
                  val values = ArrayList<Float>()
                  times += 0.0; values += 0f
                  times += plan.cutStart; values += 0f
                  for (i in 1..FADE_POINTS) {
                      val f = i.toDouble() / FADE_POINTS
                      times += plan.cutStart + (plan.cutEnd - plan.cutStart) * f
                      values += if (i == FADE_POINTS) 1f else sin(PI / 2 * f).toFloat()
                  }
                  return Curve(times.toDoubleArray(), values.toFloatArray())
              }

              /**
               * What the outgoing deck feeds its echo: nothing until the move, a beat's
               * ramp up, full to the end of the overlap, then closed so the repeats ring
               * out on their own. Null when the gesture has no echo.
               */
              fun echoSend(plan: Plan): Curve? {
                  if (!plan.echo) return null
                  val ramp = minOf(plan.outBeat * ECHO_RAMP_BEATS, (plan.cutEnd - plan.cutStart) / 2)
                  return Curve(
                      doubleArrayOf(0.0, plan.cutStart, plan.cutStart + ramp, plan.cutEnd, plan.cutEnd + ECHO_CLOSE_SECONDS),
                      floatArrayOf(0f, 0f, 1f, 1f, 0f),
                  )
              }

              // ---- The clock -------------------------------------------------------------------------------

              class Clock(val plan: Plan) : MixTimeline {
                  override val takeoverSeconds: Double get() = plan.takeover
                  override val releaseAt: Double get() = plan.cutEnd
                  override val handoffAt: Double get() = (plan.cutStart + plan.cutEnd) / 2
                  override val elementAt: Double = plan.cutEnd + SETTLE_SECONDS
                  override val elementTrackTime: Double = plan.inCue + (elementAt - plan.cutStart)

                  /** The outgoing song's beats up to the end of the move, the incoming song's after it. */
                  override val beatTimes: DoubleArray = run {
                      val times = ArrayList<Double>()
                      var t = 0.0
                      times += t
                      while (t < elementAt + 1.0 && times.size < MAX_BEATS) {
                          t += if (t < plan.cutEnd - 1e-9) plan.outBeat else plan.inBeat
                          times += t
                      }
                      times.toDoubleArray()
                  }

                  override fun beatAt(t: Double): Pair<Int, Double> {
                      if (t < 0) return -1 to 0.0
                      var low = 0
                      var high = beatTimes.size - 1
                      while (low < high) {
                          val mid = (low + high + 1) ushr 1
                          if (beatTimes[mid] <= t) low = mid else high = mid - 1
                      }
                      val k = low
                      if (k + 1 >= beatTimes.size) return k to 0.0
                      return k to minOf(1.0, (t - beatTimes[k]) / (beatTimes[k + 1] - beatTimes[k]))
                  }

                  override fun positionAt(side: LoopMix.Side, t: Double): Double? {
                      if (t < 0) return null
                      return when (side) {
                          LoopMix.Side.OUT -> if (t < plan.cutEnd + plan.tail) plan.takeover + t else null
                          LoopMix.Side.IN -> if (t >= plan.cutStart) plan.inCue + (t - plan.cutStart) else null
                      }
                  }
              }
          }
          KT_EOF
          mkdir -p "$(dirname 'shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/OverlapMixTest.kt')"
          cat > 'shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/OverlapMixTest.kt' <<'KT_EOF'
          package com.music.bitchord.playback.smart

