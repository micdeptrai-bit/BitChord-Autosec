                  val next = track("b", 94.0, "C major", vocal = 0.1) { if (it < 12.0) 0.2 else 1.0 }
                  val overlap = assertNotNull(overlapOf(current, next))
                  assertEquals(CutGesture.ECHO_CUT, overlap.gesture)
                  assertEquals(0.5, overlap.echoSeconds, 1e-9)
                  assertEquals(echoTailSeconds(0.5), overlap.tail, 1e-9)
                  val send = assertNotNull(OverlapMix.echoSend(overlap))
                  assertEquals(0f, send.values.first())
                  assertEquals(0f, send.values.last())
                  assertTrue(send.times.last() > overlap.cutEnd, "the send closes after the overlap, so the repeats ring on")
                  assertTrue(send.times.toList().zipWithNext().all { (a, b) -> b >= a }, "times rise")
              }

              @Test
              fun offWhenSwitchedOffAndForPlansThatAreNotCuts() {
                  val current = track("a", 120.0, "C major", vocal = 0.9)
                  val next = track("b", 94.0, "F♯ major", vocal = 0.9)
                  val cutPlan = assertNotNull(cut(current, next))
                  overlapOn(enabled = false) {
