              private var overlapBlockedPair: String? = null
              private var overlapActivePair: String? = null
              private var lastOverlapVerdict = ""

              /** The overlap mix for a cut the planner chose, or null (switch off, no cut, or the pair can't take it). */
              private fun overlapPlanFor(
                  player: ExoPlayer,
                  current: MediaItem,
                  next: MediaItem,
                  plan: TransitionPlan,
                  currentAnalysis: TrackAnalysis,
                  nextAnalysis: TrackAnalysis,
                  durationMs: Long,
                  nextDurationMs: Long,
                  state: SmartAnalysis,
              ): OverlapMix.Plan? {
                  if (!OverlapMix.enabled || plan.blocked || !plan.reason.contains("smart-cut")) return null
                  val pair = "${current.mediaId}->${next.mediaId}"
                  if (pair == overlapBlockedPair) return null
                  val refusal = loopRefusalFor(player, current, next, state)
                  val overlap = if (refusal == null) {
                      OverlapMix.fromCut(plan, currentAnalysis, nextAnalysis, durationMs / 1000.0, nextDurationMs / 1000.0)
                  } else {
                      null
                  }
                  val tooLate = overlap != null && overlap.takeover * 1000 - player.currentPosition < OVERLAP_MIN_LEAD_MS
                  val verdict = "$pair: " + when {
                      refusal != null -> "no overlap mix ($refusal)"
                      overlap == null -> "no overlap mix (planner's cut doesn't fit)"
                      tooLate -> "no overlap mix (too late to set up)"
                      else -> "overlap mix ${overlap.gesture.reason} at ${"%.2f".format(Locale.ROOT, overlap.takeover)}s"
                  }
                  if (verdict != lastOverlapVerdict) {
                      lastOverlapVerdict = verdict
                      Log.d(TAG, "overlap $verdict")
                  }
                  return overlap?.takeIf { !tooLate }
              }

              /** Builds the two decks off the main thread, then arms the sinks exactly as the loop mix does. */
              private fun beginOverlap(
                  out: ExoPlayer,
                  plan: OverlapMix.Plan,
                  outItem: MediaItem,
                  inItem: MediaItem,
                  durationMs: Long,
                  nextDurationMs: Long,
              ) {
                  val into = standby()
                  if (out === into) return
                  val nextIndex = out.nextMediaItemIndex
                  if (nextIndex == C.INDEX_UNSET) return
                  val outPort = loopPortOf(out) ?: return
                  val inPort = loopPortOf(into) ?: return
                  endEase(clickless = false)
                  phase = Phase.LOOP_ARMING
                  smartFadeActive = true
                  handedOff = false
                  outgoing = out
                  incoming = into
                  outgoingItemIndex = out.currentMediaItemIndex
                  armDeadline = SystemClock.elapsedRealtime() + LOOP_BUILD_TIMEOUT_MS
                  overlapActivePair = "${outItem.mediaId}->${inItem.mediaId}"
                  holdAtEnd(out)
                  val sampleRate = outPort.sampleRate
                  val inLevel = (loudnessGain(inItem.mediaId) / loudnessGain(outItem.mediaId))
                      .takeIf { it.isFinite() && it > 0f } ?: 1f
                  Log.d(
                      TAG,
                      "overlap build ${outItem.mediaId}->${inItem.mediaId} (${plan.gesture.reason}) at ${sampleRate}Hz, " +
                          "takeover at ${"%.2f".format(Locale.ROOT, plan.takeover)}s, playhead ${out.currentPosition}ms",
                  )
                  loopBuildJob = scope.launch {
                      val began = SystemClock.elapsedRealtime()
                      val session = withContext(Dispatchers.Default) {
                          runCatching {
                              OverlapMixSession.build(plan, outItem.mediaId, inItem.mediaId, sampleRate, inLevel) { side, from, to ->
                                  if (side == LoopMix.Side.OUT) {
                                      loopRegion(outItem, durationMs, from, to, sampleRate)
                                  } else {
                                      loopRegion(inItem, nextDurationMs, from, to, sampleRate)
                                  }
                              }
                          }.onFailure { Log.w(TAG, "overlap build failed", it) }.getOrNull()
                      }
                      if (phase != Phase.LOOP_ARMING || outgoing !== out) {
                          session?.close()
                          return@launch
                      }
                      if (session == null) {
                          loopFallBack("the overlap decks would not build")
                          return@launch
                      }
                      Log.d(TAG, "overlap decks built in ${SystemClock.elapsedRealtime() - began}ms")
                      armLoop(session, out, into, nextIndex, outPort, inPort)
                  }
              }

          '''

          patch(APP / "CrossfadeController.kt", [
              ("import OverlapMix",
               "import com.music.bitchord.playback.smart.LoopMix\n",
               "import com.music.bitchord.playback.smart.LoopMix\nimport com.music.bitchord.playback.smart.OverlapMix\n"),
              ("import OverlapMixSession",
               "import com.music.bitchord.playback.loopmix.LoopMixSession\n",
               "import com.music.bitchord.playback.loopmix.LoopMixSession\nimport com.music.bitchord.playback.loopmix.OverlapMixSession\n"),
              ("nhánh overlap sau nhánh loop",
               "        // Gated on *both* tracks being measured, not on the plan alone.",
               OVERLAP_BRANCH + "        // Gated on *both* tracks being measured, not on the plan alone."),
              ("hàm overlap",
               "    /** The decks are built: the incoming player loads its song, and both sinks are armed. */\n",
               OVERLAP_FUNCS + "    /** The decks are built: the incoming player loads its song, and both sinks are armed. */\n"),
              ("vị trí bài đang phát qua timeline",
               "        val position = LoopMix.positionAt(session.clock, side, m) ?: return null\n",
               "        val position = session.clock.positionAt(side, m) ?: return null\n"),
              ("settle sau handover qua timeline",
               "wasHandedOff -> m?.let { LoopMix.positionAt(session.clock, LoopMix.Side.IN, it) }?.let { (it * 1000).roundToLong() }",
               "wasHandedOff -> m?.let { session.clock.positionAt(LoopMix.Side.IN, it) }?.let { (it * 1000).roundToLong() }"),
              ("settle ở bài cũ qua timeline",
               "tookOver -> (m?.takeIf { it >= 0 }?.let { LoopMix.positionAt(session.clock, LoopMix.Side.OUT, it) }\n"
               "                ?: session.plan.out.loopStart).let { (it * 1000).roundToLong() }",
               "tookOver -> (m?.takeIf { it >= 0 }?.let { session.clock.positionAt(LoopMix.Side.OUT, it) }\n"
               "                ?: session.clock.takeoverSeconds).let { (it * 1000).roundToLong() }"),
              ("nhãn stats cho overlap",
               "return \"Automix · $stage · ${describeLoop(session.plan)}$aligned\"",
               "return \"Automix · $stage · ${session.plan?.let { describeLoop(it) } ?: session.label}$aligned\""),
              ("lỗi build thì chặn overlap cho cặp này",
               "        loopPlanned = null\n        loopRefusal = reason\n        loopBail(reason, settle = false)\n",
               "        loopPlanned = null\n        loopRefusal = reason\n        overlapBlockedPair = overlapActivePair\n        loopBail(reason, settle = false)\n"),
              ("nhãn stage cho overlap",
               "                m < session.clock.releaseAt -> \"looping\"\n                else -> \"letting go\"\n",
               "                m < session.clock.releaseAt -> if (session.plan == null) \"mixing\" else \"looping\"\n"
               "                else -> if (session.plan == null) \"ringing out\" else \"letting go\"\n"),
              ("hằng số OVERLAP_MIN_LEAD_MS",
               "        const val LOOP_MIN_LEAD_MS = 9_000L\n",
               "        const val LOOP_MIN_LEAD_MS = 9_000L\n\n        /** An overlap mix is only set up while its takeover is at least this far ahead. */\n        const val OVERLAP_MIN_LEAD_MS = 6_000L\n"),
          ])
          PY_EOF

      - name: Vá renderer native, LoopMix.Clock, LoopMixSession và CrossfadeController (bước 3)
        run: python3 .github/step3-patch.py

      - name: Đặt công tắc overlap_engine
        shell: bash
        run: |
          set -euo pipefail
          F='shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/OverlapMix.kt'
          sed -i "s/var enabled: Boolean = false/var enabled: Boolean = ${{ inputs.overlap_engine }}/" "$F"
          grep -n "var enabled" "$F"

      - name: Test native của echo (g++ trên máy chạy, không cần NDK)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -I native -I native/third_party/signalsmith-stretch -I native/third_party/signalsmith-linear -I native/third_party \
            native/loopmix/tests/echo_test.cpp native/loopmix/loop_mix_renderer.cpp -o /tmp/echo_test
          /tmp/echo_test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: Test bộ chọn bài + kiểu cắt + overlap + loop mix + planner cũ
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest \
            --tests "com.music.bitchord.playback.smart.NextTrackSelectorTest" \
            --tests "com.music.bitchord.playback.smart.TransitionRepertoireTest" \
            --tests "com.music.bitchord.playback.smart.AdvancedAutomixPlannerTest" \
            --tests "com.music.bitchord.playback.smart.PhraseBarAutomixTest" \
            --tests "com.music.bitchord.playback.smart.LoopMixTest" \
            --tests "com.music.bitchord.playback.smart.OverlapMixTest" 2>&1 | tee build.log

      - name: Build APK dev benchmark
        if: ${{ inputs.build_apk }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDevBenchmark 2>&1 | tee -a build.log
          ls -la app/build/outputs/apk/dev/benchmark/

      - name: Upload APK arm64
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-step1-3-automix-arm64
          path: app/build/outputs/apk/dev/benchmark/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Commit lên nhánh feature/next-track-selector
        if: ${{ inputs.push_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B feature/next-track-selector
          git add \
            shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/NextTrackSelector.kt \
            shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/NextTrackSelectorTest.kt \
            app/src/main/java/com/music/bitchord/playback/AutoplaySequencer.kt \
            app/src/main/java/com/music/bitchord/playback/Autoplay.kt \
            app/src/main/java/com/music/bitchord/playback/PlaybackService.kt
          git commit -m "Automix: order AutoPlay candidates by tempo, key, energy and vocals (NextTrackSelector)"
          git add \
            shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/TransitionRepertoire.kt \
            shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/TransitionPlanner.kt \
            shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/TransitionRepertoireTest.kt \
            shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/AdvancedAutomixPlannerTest.kt \
            app/src/main/java/com/music/bitchord/playback/CrossfadeController.kt \
            shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/MixTimeline.kt \
            shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/OverlapMix.kt \
            shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/LoopMix.kt \
            shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/OverlapMixTest.kt \
            app/src/main/java/com/music/bitchord/playback/loopmix/OverlapMixSession.kt \
            app/src/main/java/com/music/bitchord/playback/loopmix/LoopMixSession.kt \
            app/src/main/java/com/music/bitchord/playback/loopmix/LoopMixRenderer.kt \
            app/src/main/cpp/jni/loopmix_jni.cpp \
            native/loopmix/loop_mix_renderer.h \
            native/loopmix/loop_mix_renderer.cpp \
            native/loopmix/tests/echo_test.cpp
          git commit -m "Automix: cut repertoire (quick cut, drop cut, echo-out) rendered by the native overlap engine (steps 2+3a)"
          git push --force-with-lease origin feature/next-track-selector

      - name: Tóm tắt
        if: ${{ always() }}
        run: |
          {
            echo "### Bước 1+2+3a: NextTrackSelector + TransitionRepertoire + engine overlap native"
            echo "- Test: ${{ inputs.run_tests }} | APK: ${{ inputs.build_apk }} | Echo cut: ${{ inputs.echo_cut }} | Overlap engine: ${{ inputs.overlap_engine }} | Push nhánh: ${{ inputs.push_branch }}"
            echo "- Logcat bước 3a: tag BitChordOverlapMix, và dòng \"overlap ...\" của CrossfadeController"
            echo "- Logcat tag bước 1: BitChordSequencer"
            echo "- Bước 2: bật Advanced Automix; nhãn Automix trên UI hiện \"cut mix ... quick/drop/echo\" khi dùng kiểu cắt"
          } >> "$GITHUB_STEP_SUMMARY"
