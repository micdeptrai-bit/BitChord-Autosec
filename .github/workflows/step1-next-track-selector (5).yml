          package com.music.bitchord.playback.smart

          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          /**
           * The extra gestures a pair that cannot be beatmatched can get instead of a
           * plain crossfade. Each is a short, downbeat-aligned move a DJ would make
           * when two songs will not share a grid.
           */
          enum class CutGesture(val reason: String) {
              /** Leave on an outgoing downbeat, arrive on an incoming downbeat. Loud into loud. */
              QUICK_CUT("smart-cut-quick"),

              /** Same cut, but the incoming song is cued at its drop instead of its intro. */
              DROP_CUT("smart-cut-drop"),

              /** The outgoing song echoes out over a quiet incoming intro. */
              ECHO_CUT("smart-cut-echo"),
          }

          /**
           * Picks and plans a [CutGesture] for a pair the planner has already judged
           * unmixable (tempo out of reach, plus a key clash or two singers).
           *
           * Pure: reads two [TrackAnalysis] values and returns a [TransitionPlan], or
           * null when the evidence does not support a cut — in which case the caller
           * keeps its plain crossfade. Only used with Advanced Automix on.
           *
           * Every plan reuses fields the renderer already understands (EQUAL_POWER with
           * a short fade; the existing echo-out when [TransitionPlan.echoSeconds] is
           * set), so no renderer change is needed.
           */
          object TransitionRepertoire {
              /** Master switch. False gives back the plain crossfade for every unmixable pair. */
              var enabled: Boolean = true

              /**
               * The echo-out gesture on its own. Echo-out was switched off in the planner once because
               * repeats at the outgoing tempo flam over an incoming track at another one; this only plans
               * it over a quiet incoming intro, but it is the gesture to judge by ear first.
               */
              var echoCutEnabled: Boolean = true

              /** Length of a cut's fade. Short enough to read as a cut, long enough not to click. */
              const val CUT_FADE_SECONDS = 0.5

              /** How far before the real end of the outgoing song a cut may leave. */
              private const val MAX_EXIT_SEARCH_SECONDS = 20.0

              /** A phrase boundary is preferred over the last downbeat when it is within this many beats of it. */
              private const val PHRASE_SLACK_BEATS = 16.0

              private const val MIN_DOWNBEATS = 8

              /** Seconds of music compared either side of a join when judging energy. */
              private const val ENERGY_WINDOW_SECONDS = 4.0

              /** Energy, against the track's own mean, at or above which a passage counts as loud. */
              private const val LOUD = 0.6

              /** Energy, against the track's own mean, below which an intro counts as quiet. */
              private const val QUIET = 0.55

              /** How much louder the window after a point must be than the one before it to count as a drop. */
              private const val DROP_STEP = 1.5

              /** A drop closer than this to the intro start is just the intro. */
              private const val MIN_DROP_DISTANCE_SECONDS = 4.0

              /** Both tracks at or above this whole-track vocal likelihood count as two singers. */
              private const val BOTH_SING = 0.5

              /** The echo-out overlap, in outgoing beats. Eight is what the renderer's dry-kill is sized for. */
              private const val ECHO_CUT_BEATS = 8

              /** Music that must remain in the incoming file after an echo-out overlap. */
              private const val INCOMING_CLEARANCE_SECONDS = 8.0

              fun plan(
                  analysis: TrackAnalysis,
                  nextAnalysis: TrackAnalysis,
                  length: Double,
                  nextLength: Double,
                  finalMixAnchor: Double,
                  advanced: Boolean,
              ): TransitionPlan? {
                  if (!enabled || !advanced) return null
                  if (length <= 0.0 || nextLength <= 0.0) return null

                  // A cut on the downbeat is only as good as the outgoing downbeat grid.
                  val beat = beatSecondsOf(analysis)
                  if (beat <= 0.0) return null
                  if (analysis.beatConfidence.orZero() < MIN_DJ_CONFIDENCE) return null
                  if (analysis.downbeats.size < MIN_DOWNBEATS) return null

                  val lowest = max(0.0, finalMixAnchor - MAX_EXIT_SEARCH_SECONDS)
                  val highest = finalMixAnchor - CUT_FADE_SECONDS
                  val exit = cutExit(analysis, beat, lowest, highest) ?: return null
                  if (exit < CUT_FADE_SECONDS) return null

                  // Where the incoming song arrives: its first downbeat once it makes sound.
                  val nextBeat = beatSecondsOf(nextAnalysis)
                  val nextGrid = nextBeat > 0.0 && nextAnalysis.beatConfidence.orZero() >= MIN_DJ_CONFIDENCE
                  val floor = max(audibleStartOf(nextAnalysis), CUT_FADE_SECONDS)
                  val entry = (if (nextGrid) nextAnalysis.downbeats.firstOrNull { it >= floor - 0.05 } else null) ?: floor

                  // Unknown energy is not evidence of anything: no cut on a guess.
                  val outLevel = relativeEnergy(analysis.energyCurve, exit - ENERGY_WINDOW_SECONDS, exit) ?: return null
                  val entryLevel = relativeEnergy(nextAnalysis.energyCurve, entry, entry + ENERGY_WINDOW_SECONDS)
                      ?: return null

                  val bothSing = analysis.vocalProbability >= BOTH_SING && nextAnalysis.vocalProbability >= BOTH_SING

                  if (echoCutEnabled && !bothSing && outLevel >= LOUD && entryLevel < QUIET) {
                      echoPlan(analysis, beat, length, nextLength, lowest, highest, entry)?.let { return it }
                  }
                  if (outLevel < LOUD) return null

                  val latest = latestIncomingCue(nextLength)
                  val dropRaw = incomingCuePoint(nextAnalysis, latest)
                  val drop = nextAnalysis.downbeats
                      .filter { abs(it - dropRaw) <= max(0.5, 2 * nextBeat) }
                      .minByOrNull { abs(it - dropRaw) } ?: dropRaw
                  if (isDrop(nextAnalysis, entry, drop, latest)) {
                      return cut(CutGesture.DROP_CUT, exit, cue = drop - CUT_FADE_SECONDS, handoff = drop)
                  }
                  if (entryLevel >= LOUD) {
                      return cut(CutGesture.QUICK_CUT, exit, cue = entry - CUT_FADE_SECONDS, handoff = entry)
                  }
                  return null
              }

              private fun beatSecondsOf(analysis: TrackAnalysis): Double {
                  val interval = analysis.beatInterval.orZero()
                  if (interval > 0.0) return interval
                  val bpm = analysis.bpm.orZero()
                  return if (bpm > 0.0) 60.0 / bpm else 0.0
              }

              /** The last downbeat before the end, pulled back to a phrase boundary when one is close. */
              private fun cutExit(analysis: TrackAnalysis, beat: Double, lowest: Double, highest: Double): Double? {
                  val downbeat = analysis.downbeats.filter { it in lowest..highest }.maxOrNull() ?: return null
                  val phrase = analysis.phraseBoundaries.filter { it in lowest..highest }.maxOrNull()
                  return if (phrase != null && downbeat - phrase <= PHRASE_SLACK_BEATS * beat) phrase else downbeat
              }

              private fun isDrop(next: TrackAnalysis, entry: Double, drop: Double, latest: Double): Boolean {
                  if (drop - entry < MIN_DROP_DISTANCE_SECONDS || drop > latest) return false
                  val curve = next.energyCurve
                  val before = windowEnergy(curve, drop - ENERGY_WINDOW_SECONDS, drop) ?: return false
                  val after = windowEnergy(curve, drop, drop + ENERGY_WINDOW_SECONDS) ?: return false
                  if (before <= 0.0 || after / before < DROP_STEP) return false
                  val level = relativeEnergy(curve, drop, drop + ENERGY_WINDOW_SECONDS) ?: return false
                  return level >= LOUD
              }

              /** A cut: a [CUT_FADE_SECONDS] equal-power fade ending on [exit], with the incoming downbeat landing on it. */
              private fun cut(gesture: CutGesture, exit: Double, cue: Double, handoff: Double): TransitionPlan =
                  TransitionPlan(
                      markerVisible = true,
                      transitionStart = exit - CUT_FADE_SECONDS,
                      transitionEnd = exit,
                      fadeSeconds = CUT_FADE_SECONDS,
                      transitionStyle = TransitionStyle.EQUAL_POWER,
                      incomingCueTime = max(0.0, cue),
                      incomingHandoffTime = handoff,
                      reason = gesture.reason,
                  )

              /**
               * An echo-out: [ECHO_CUT_BEATS] outgoing beats of overlap over the incoming intro, ending on a
               * downbeat that leaves room in the outgoing file for the repeats to ring (the renderer
               * generates them from the outgoing audio, which dies with the file).
               */
              private fun echoPlan(
                  analysis: TrackAnalysis,
                  beat: Double,
                  length: Double,
                  nextLength: Double,
                  lowest: Double,
                  highest: Double,
                  entry: Double,
              ): TransitionPlan? {
                  val echoSeconds = min(beat, MAX_ECHO_SECONDS)
                  val tail = echoTailSeconds(echoSeconds)
                  val overlap = ECHO_CUT_BEATS * beat
                  val exit = analysis.downbeats
                      .filter { it in lowest..highest && length - it >= tail && it - overlap >= 0.0 }
                      .maxOrNull() ?: return null
                  if (entry + overlap > nextLength - INCOMING_CLEARANCE_SECONDS) return null
                  return TransitionPlan(
                      markerVisible = true,
                      transitionStart = exit - overlap,
                      transitionEnd = exit,
                      fadeSeconds = overlap,
                      transitionStyle = TransitionStyle.EQUAL_POWER,
                      incomingCueTime = entry,
                      incomingHandoffTime = entry + overlap,
                      beatSeconds = beat,
                      echoSeconds = echoSeconds,
                      reason = CutGesture.ECHO_CUT.reason,
                  )
              }

              private fun windowEnergy(curve: List<EnergySample>, from: Double, until: Double): Double? {
                  val inside = curve.filter { it.energy.isFinite() && it.time >= from && it.time < until }
                  if (inside.isEmpty()) return null
                  return inside.sumOf { it.energy } / inside.size
              }

              /** Mean energy over the window, against the track's own mean over its whole curve. */
              private fun relativeEnergy(curve: List<EnergySample>, from: Double, until: Double): Double? {
                  val finite = curve.filter { it.energy.isFinite() }
                  if (finite.isEmpty()) return null
                  val reference = finite.sumOf { it.energy } / finite.size
                  if (reference <= 0.0) return null
                  val window = windowEnergy(curve, from, until) ?: return null
                  return window / reference
              }
          }
          KT_EOF

