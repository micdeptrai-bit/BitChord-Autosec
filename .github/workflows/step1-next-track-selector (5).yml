name: "Bước 1+2+3 - Chọn bài kế tiếp + kiểu chuyển cắt + engine overlap native (AI DJ)"

# ======================================================================================
# GHI CHÚ BÀN GIAO (để làm tiếp ở chat mới nếu hết quota: dán nguyên file này vào chat)
# ======================================================================================
# MỤC TIÊU DÀI HẠN: Automix của BitChord mix kiểu Spotify/Apple Music (không chỉ crossfade).
# Lộ trình đã thống nhất:
#   0. Bàn nghe thử offline: render transition của 2 file ra WAV trên máy tính.
#   1. Bộ chọn bài kế tiếp (FILE NÀY): sắp lại bài autoplay theo BPM / key Camelot / năng lượng / vocal.
#   2. Thêm kiểu chuyển: quick cut trên downbeat + echo/reverb, drop swap, loop roll.
#   3. Gộp về một engine native (mở rộng renderer loop mix của Signalsmith thành "render cả đoạn overlap").
#   4. Stem thật (thêm model bass/drums của Open-Unmix, chỉ chạy trên đoạn transition, tuỳ chọn).
#   5. "AI" đúng nghĩa: log skip trong 10 giây sau transition để tự chỉnh ngưỡng; giọng DJ = LLM + TTS (tách khỏi audio).
#
# BƯỚC 1 LÀM GÌ
#   - shared/.../playback/smart/NextTrackSelector.kt   (logic thuần, có test): chấm điểm từng cặp bài
#       tempo 40% (gập octave, cửa sổ stretch 0.9-1.25, lưới nhịp kém tin cậy bị trừ),
#       key 30% (bánh xe Camelot, kể cả major/minor tương đối), năng lượng outro->intro 15%,
#       vocal 15% (cả hai cùng hát bị trừ). Bài chưa phân tích = "không rõ" (0.5), giữ nguyên thứ tự radio.
#       Thứ tự radio vẫn là tie-breaker nhẹ (trừ 0.012 mỗi hạng, tối đa 0.3).
#   - app/.../playback/AutoplaySequencer.kt            : đọc analysis đã có (bài đang phát + bài từng phân tích),
#       sắp lại danh sách radio TRƯỚC khi QueueBuilder.extend chọn. Không bao giờ tự bắt đầu phân tích.
#   - Vá Autoplay.kt (thêm tham số after + gọi sequencer) và PlaybackService.kt (cài/gỡ lookup, truyền bài cuối hàng đợi).
#   - shared/.../NextTrackSelectorTest.kt              : test.
#
# GIỚI HẠN ĐÃ BIẾT (đây là lý do có bước 1b)
#   - Chỉ có tác dụng khi bài đứng trước (queue tail hoặc bài đang phát) VÀ ứng viên đã có analysis trên đĩa.
#     Mỗi lần đổi bài autoplay chỉ bù 1 bài, mà đuôi hàng đợi thường chưa phân tích => lúc đó là no-op.
#     Hiệu quả rõ nhất ở lô đầu (radio vừa bắt đầu, bài đang phát đã phân tích).
#   - BƯỚC 1b (chưa làm): tự phân tích trước 2-3 bài đầu autoplay ở nền (TrackAnalyzer.request với
#     AutomixAnalysisSource.opusUri(videoId)), rồi sắp lại phần còn chưa phát. Cần kiểm tra cách resolve URI và pin.
#   - Chưa có công tắc trong Cài đặt: tắt bằng AutoplaySequencer.enabled = false (cần thêm AppSettings + UI nếu muốn).
#   - Phát hiện thêm: harmonicallyCompatible() trong TransitionPlanner.kt coi C major <-> A minor (tương đối,
#     cặp hợp nhất) là KHÔNG hợp (nó so khoảng cách nửa cung). Selector mới dùng Camelot nên đúng; nên sửa luôn
#     cả planner ở bước sau.
#   - Code này CHƯA được biên dịch khi viết (môi trường soạn không có Kotlin). Workflow chạy test rồi build để kiểm tra.
#     Nếu lỗi compile: tải artifact "build-log", gửi lại để sửa.
#
# BƯỚC 2 LÀM GÌ (đã nối vào cùng file này; chạy cùng bước 1)
#   - shared/.../playback/smart/TransitionRepertoire.kt (logic thuần, có test): với cặp "unmixable"
#       (tempo ngoài tầm stretch + lệch key hoặc cả hai cùng hát), thay vì crossfade phẳng 6s, chọn 1 trong 3 kiểu:
#       QUICK_CUT  rời bài cũ ở downbeat/ranh giới câu nhạc, vào bài mới đúng downbeat (loud -> loud).
#       DROP_CUT   như trên nhưng cue bài mới vào đoạn drop (bước nhảy năng lượng >= 1.5x), tối đa 25% đầu bài.
#       ECHO_CUT   echo-out 8 beat đè lên intro êm của bài mới (chỉ khi KHÔNG cả hai cùng hát, còn chỗ cho đuôi echo).
#       Không đủ bằng chứng (thiếu lưới nhịp tin cậy, thiếu đường năng lượng, cuối bài nhỏ) -> trả null,
#       planner chạy crossfade cũ y nguyên.
#   - Chỉ bật khi Advanced Automix bật. Automix thường (classic) không đổi.
#   - Chỉ dùng field renderer đã hiểu (EQUAL_POWER + fade 0.5s; echo dùng đường echo-out có sẵn) => KHÔNG đổi enum,
#       KHÔNG đụng renderer. Vá TransitionPlanner.kt đúng 1 chỗ (nhánh isUnmixablePair) + 1 dòng nhãn UI trong CrossfadeController.kt.
#   - Test cũ anUnmixablePairIsCrossfadedAtTheEndIntoTheIntro ghim hành vi crossfade phẳng => patch tắt repertoire trong test đó.
#   - Công tắc: TransitionRepertoire.enabled / TransitionRepertoire.echoCutEnabled (input echo_cut của workflow đặt mặc định cho cái sau).
#
# GIỚI HẠN CỦA BƯỚC 2 (đọc kỹ)
#   - ECHO-OUT TỪNG BỊ TẮT TRONG PLANNER (mixPlan: "echoSeconds = 0.0"): lặp echo theo tempo bài cũ bị lệch (flam) với bài mới,
#       và lúc dập tiếng khô nghe như bài bị cắt. ECHO_CUT chỉ lên kế hoạch trên intro êm của bài mới, nhưng đây là kiểu phải NGHE THỬ
#       đầu tiên. Nghe dở thì chạy lại workflow với echo_cut = false (QUICK_CUT/DROP_CUT vẫn giữ).
#   - "Drop swap" cho cặp khớp tempo ĐÃ CÓ sẵn trong mixPlan (incomingHandoffTime = drop, cue lùi sao cho drop rơi đúng cuối overlap),
#       nên bước 2 chỉ thêm "cut tới drop" cho cặp unmixable, không viết lại drop swap.
#   - LOOP ROLL chưa làm (cần chạm LoopMix + renderer native) => để bước 2b.
#   - Mốc cắt tối đa 20s trước hết bài; ngưỡng (LOUD 0.6, QUIET 0.55, DROP_STEP 1.5) là ước lượng, chưa chỉnh bằng tai.
#   - Code CHƯA được biên dịch khi viết. Workflow chạy test rồi build; lỗi compile thì tải artifact "build-log" gửi lại.
#
# BƯỚC 3 LÀM GÌ (3a: nền móng gộp engine; đã nối vào cùng file này, chạy cùng bước 1+2)
#   Mục tiêu: các kiểu chuyển của bước 2 (QUICK_CUT / DROP_CUT / ECHO_CUT) không còn đi qua 2 ExoPlayer + chỉnh volume,
#   mà do CÙNG renderer native của loop mix dựng (một clock, sink bài cũ tiếp quản chính xác từng sample, gain equal-power
#   tính trong renderer, echo thật). Dùng lại nguyên đường LOOP_ARMING -> LOOP_RUNNING của controller (căn pha player bài mới,
#   handover 25 ms, bail/finish), nên không viết state machine thứ hai.
#   - native/loopmix: Deck có thêm ECHO (feedback delay; envelope "send" kind=3; đuôi vẫn ngân sau khi send đóng).
#       Thêm JNI nativeSetEcho + LoopMixRenderer.setEcho / KIND_ECHO_SEND. Có test native chạy ngay trong workflow
#       (native/loopmix/tests/echo_test.cpp: lặp lại ×0.8, rồi ×0.5, ×0.5, đuôi tắt sạch).
#   - shared/.../smart/MixTimeline.kt: interface chung (takeover, beatTimes, handoffAt, elementAt, positionAt...).
#       LoopMix.Clock giờ implements nó (chỉ thêm `override`, hành vi y nguyên; LoopMixTest được chạy để chắc).
#   - shared/.../smart/OverlapMix.kt (logic thuần, có test): từ TransitionPlan kiểu "smart-cut-*" dựng Plan + Clock + đường cong gain
#       (equal power, 8 điểm) + đường send của echo. Bài cũ vào deck TAKEOVER_LEAD_SECONDS=4s trước đoạn chuyển, hai deck chạy rate 1
#       (không stretch), player bài mới nhận lại sau SETTLE_SECONDS=3s. Từ chối (trả null) nếu đuôi echo vượt file, bài mới còn quá ít, v.v.
#   - app/.../loopmix/OverlapMixSession.kt: dựng LoopMixSession (plan = null) từ OverlapMix.Plan.
#   - Vá LoopMixSession (nhận MixTimeline, constructor internal), CrossfadeController (nhánh overlap SAU nhánh loop, TRƯỚC blend;
#       ba chỗ LoopMix.positionAt đổi sang session.clock.positionAt; nhãn stats; chặn overlap cho cặp đã build lỗi).
#   - Công tắc: OverlapMix.enabled (input overlap_engine của workflow, MẶC ĐỊNH TẮT). Tắt = mọi thứ chạy y như bước 2.
#     Điều kiện giống loop mix (loopRefusalFor): 1x, không skip silence, đã phân tích cả hai bài, sink hỗ trợ, v.v. Lỗi build -> về đường cũ.
#
# GIỚI HẠN CỦA BƯỚC 3a (đọc kỹ)
#   - MỚI CHỈ phủ 3 kiểu cắt của bước 2. Blend beatmatch / DJ filter / crossfade thường của planner VẪN chạy 2 player như cũ.
#     Đó là bước 3b: thêm tempo ramp (knots đã có sẵn trong renderer), EQ bass swap, filter sweep vào OverlapMix rồi chuyển từng loại sang.
#     Chỉ khi 3b xong mới bỏ được đường 2 player.
#   - Phần C++ đã biên dịch + chạy test trên máy soạn. Phần Kotlin CHƯA biên dịch (không có kotlinc): workflow chạy test rồi build,
#     lỗi compile thì tải artifact "build-log" gửi lại.
#   - CHƯA nghe thử trên máy. Cần kiểm bằng tai: (1) cú splice lúc bài cũ vào deck (logcat "loop splice: deck ... r=" nên r ~ 1),
#     (2) handover sang player bài mới ("loop align ... left at ... ms" nên < 1.5 ms), (3) echo có flam với bài mới không.
#   - Ngưỡng mới là ước lượng: TAKEOVER_LEAD 4s, SETTLE 3s, feedback echo 0.5, return 0.8. Cặp nào setup trễ (takeover cách playhead < 6s)
#     thì bỏ qua overlap và dùng đường cũ.
#   - Logcat: tag BitChordOverlapMix (dựng deck) và dòng "overlap ..." trong tag của CrossfadeController (verdict từng cặp).
#
# CÁCH DÙNG
#   1. Chép file này vào .github/workflows/step1-next-track-selector.yml rồi commit.
#   2. Actions -> "Bước 1+2+3 - Chọn bài kế tiếp + kiểu chuyển cắt + engine overlap native (AI DJ)" -> Run workflow.
#      run_tests: chạy test của selector + repertoire + test planner cũ (nhanh).
#      echo_cut: bật/tắt ECHO_CUT (mặc định bật; tắt nếu nghe dở).
#      build_apk: build APK dev benchmark arm64 để nghe thử.
#      overlap_engine: bật engine overlap native cho các kiểu cắt (bước 3a). Mặc định TẮT; bật để nghe thử, nghe dở thì chạy lại với false.
#      push_branch: commit lên nhánh feature/next-track-selector (KHÔNG đụng main). Mặc định chỉ build trong bản sao tạm.
#   3. Muốn thấy nó hoạt động: lọc logcat theo tag BitChordSequencer; dòng "known=x/y top=..." cho biết điểm từng yếu tố.
#   4. Nếu m sync fork từ upstream: patch dùng thay chuỗi chính xác và DỪNG, báo rõ chỗ nào đổi, không sửa dở.
# ======================================================================================

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Chạy test NextTrackSelectorTest trước khi build"
        type: boolean
        default: true
      build_apk:
        description: "Build APK dev benchmark arm64"
        type: boolean
        default: true
      echo_cut:
        description: "Bật kiểu ECHO_CUT (echo-out đè lên intro êm). Tắt nếu nghe dở"
        type: boolean
        default: true
      overlap_engine:
        description: "Bước 3a: render các kiểu cắt bằng renderer native (một clock, echo thật). Mặc định tắt"
        type: boolean
        default: false
      push_branch:
        description: "Commit lên nhánh feature/next-track-selector (không đụng main)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  step1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ghi các file mới
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/NextTrackSelector.kt')"
          cat > 'shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/NextTrackSelector.kt' <<'KT_EOF'
          package com.music.bitchord.playback.smart

          import kotlin.math.abs
          import kotlin.math.ln
          import kotlin.math.min
          import kotlin.math.roundToInt

          /**
           * Picks which song should follow which, the way a DJ builds a set: tempo that
           * can be matched, a key that does not clash, a similar energy at the join, and
           * no two sung songs laid over each other.
           *
           * Pure: no audio, no players, no I/O. It reads stored [TrackAnalysis] and
           * returns an order. A candidate with no usable analysis is *unknown*, not bad:
           * it scores [UNKNOWN_MIX], so tracks nothing has measured yet stay in the order
           * the radio gave them, and measured ones only move when the evidence is clear.
           *
           * The radio's own order is relevance (what YouTube thinks fits the seed), so it
           * is kept as a gentle tie-breaker: each position down the list costs
           * [RANK_PENALTY], capped at [MAX_RANK_PENALTY].
           */
          object NextTrackSelector {

              const val WEIGHT_TEMPO = 0.40
              const val WEIGHT_KEY = 0.30
              const val WEIGHT_ENERGY = 0.15
              const val WEIGHT_VOCAL = 0.15

              /** What a candidate with no usable analysis scores. */
              const val UNKNOWN_MIX = 0.5

              /** Score lost per position down the radio's list, up to [MAX_RANK_PENALTY]. */
              const val RANK_PENALTY = 0.012
              const val MAX_RANK_PENALTY = 0.3

              const val MIN_KEY_CONFIDENCE = 0.25

              /** Both songs at or above this vocal probability: sung over sung. Same value the planner uses. */
              const val VOCAL_BOTH_SING = 0.62

              /** How much of the outgoing outro and incoming intro the energy comparison looks at. */
              const val ENERGY_WINDOW_SECONDS = 30.0

              /** Tempo score kept when either beat grid is below [MIN_BEATMATCH_CONFIDENCE]: no beatmatch, at best DJ-assisted. */
              private const val UNTRUSTED_GRID_FACTOR = 0.6

              /** A candidate and what is stored about it ([analysis] null or unusable = unknown). */
              data class Candidate<T>(val item: T, val analysis: TrackAnalysis?)

              class Mix(val value: Double, val detail: String)

              data class Scored<T>(
                  val item: T,
                  /** 0..1, how well it follows the previous song; [UNKNOWN_MIX] when not measured. */
                  val mix: Double,
                  val known: Boolean,
                  /** [mix] minus the rank penalty: what the order is sorted by. */
                  val score: Double,
                  val detail: String,
              )

              /**
               * [candidates] (given in the radio's relevance order) sorted by how well
               * each follows [previous]. Stable: equal scores keep their given order.
               * A null or unusable [previous] leaves the order untouched.
               */
              fun <T> order(previous: TrackAnalysis?, candidates: List<Candidate<T>>): List<Scored<T>> {
                  val scored = candidates.mapIndexed { index, candidate ->
                      val analysis = candidate.analysis
                      val known = previous != null && previous.isUsable && analysis != null && analysis.isUsable
                      val mix = if (known) mixOf(previous!!, analysis!!) else Mix(UNKNOWN_MIX, "unknown")
                      val penalty = min(MAX_RANK_PENALTY, index * RANK_PENALTY)
                      Scored(candidate.item, mix.value, known, mix.value - penalty, mix.detail)
                  }
                  return scored.sortedByDescending { it.score }
              }

              /**
               * Greedy chain: the best follower of [previous], then the best follower of
               * that one, and so on until every candidate is placed. Where the chosen
               * song is unknown the chain loses its footing and the rest keep radio order.
               */
              fun <T> chain(previous: TrackAnalysis?, candidates: List<Candidate<T>>): List<Scored<T>> {
                  val remaining = candidates.toMutableList()
                  val result = ArrayList<Scored<T>>(candidates.size)
                  var current = previous
                  while (remaining.isNotEmpty()) {
                      val best = order(current, remaining).first()
                      val at = remaining.indexOfFirst { it.item === best.item || it.item == best.item }
                      val taken = remaining.removeAt(at)
                      result.add(best)
                      current = taken.analysis?.takeIf { it.isUsable }
                  }
                  return result
              }

              internal fun mixOf(previous: TrackAnalysis, next: TrackAnalysis): Mix {
                  val names = ArrayList<String>()
                  val scores = ArrayList<Double>()
                  val weights = ArrayList<Double>()
                  fun part(name: String, score: Double?, weight: Double) {
                      if (score == null) return
                      names.add(name)
                      scores.add(score)
                      weights.add(weight)
                  }
                  part("tempo", tempoScore(previous, next), WEIGHT_TEMPO)
                  part("key", keyScore(trustedKey(previous), trustedKey(next)), WEIGHT_KEY)
                  part("energy", energyScore(previous, next), WEIGHT_ENERGY)
                  part("vocal", vocalScore(previous, next), WEIGHT_VOCAL)
                  var weighted = 0.0
                  var total = 0.0
                  for (i in scores.indices) {
                      weighted += scores[i] * weights[i]
                      total += weights[i]
                  }
                  val value = if (total > 0) weighted / total else UNKNOWN_MIX
                  val detail = names.indices.joinToString(" ") { "${names[it]}=${(scores[it] * 100).roundToInt()}" }
                  return Mix(value, detail)
              }

              /** 1.0 for the same tempo (octave-folded), falling as the stretch needed grows; ~0 beyond the stretch window. */
              internal fun tempoScore(previous: TrackAnalysis, next: TrackAnalysis): Double? {
                  val rate = incomingRateBetween(previous.bpm, next.bpm)
                  if (!rate.isFinite()) return null
                  val deviation = abs(ln(rate))
                  val base = when {
                      deviation <= 0.03 -> 1.0
                      deviation <= 0.07 -> 0.85
                      stretchReachable(previous.bpm, next.bpm) -> {
                          // Slowing a song down is the direction that sounds worse.
                          val weighted = if (rate < 1.0) deviation * 1.5 else deviation
                          0.7 - ((weighted - 0.07) / 0.16).coerceIn(0.0, 1.0) * 0.4
                      }
                      else -> 0.05
                  }
                  val trusted = previous.beatConfidence >= MIN_BEATMATCH_CONFIDENCE &&
                      next.beatConfidence >= MIN_BEATMATCH_CONFIDENCE
                  return if (trusted) base else base * UNTRUSTED_GRID_FACTOR
              }

              private fun trustedKey(analysis: TrackAnalysis): String =
                  if (analysis.key.isBlank() || analysis.keyConfidence < MIN_KEY_CONFIDENCE) "" else analysis.key

              /**
               * Distance on the Camelot wheel: the same key and its relative major/minor
               * are 0 and 1 steps apart, a neighbour on the wheel is 1, a diagonal is 2.
               * Null when either key is missing or unreadable.
               */
              internal fun keyScore(left: String, right: String): Double? {
                  val a = camelot(left) ?: return null
                  val b = camelot(right) ?: return null
                  val around = abs(a.first - b.first)
                  val steps = min(around, 12 - around) + if (a.second != b.second) 1 else 0
                  return when (steps) {
                      0 -> 1.0
                      1 -> 0.9
                      2 -> 0.6
                      3 -> 0.3
                      else -> 0.1
                  }
              }

              private val PITCH = mapOf(
                  "C" to 0, "C♯" to 1, "D♭" to 1, "D" to 2, "D♯" to 3, "E♭" to 3,
                  "E" to 4, "F" to 5, "F♯" to 6, "G♭" to 6, "G" to 7, "G♯" to 8,
                  "A♭" to 8, "A" to 9, "A♯" to 10, "B♭" to 10, "B" to 11,
              )

              /** Camelot number 1..12 and whether the key is major (B), or null for a key it cannot read. */
              internal fun camelot(key: String): Pair<Int, Boolean>? {
                  val parts = key.trim().split(' ').filter { it.isNotEmpty() }
                  val raw = parts.getOrNull(0)?.replace('#', '♯') ?: return null
                  val name = if (raw.length == 2 && raw[1] == 'b') raw.substring(0, 1) + "♭" else raw
                  val pitch = PITCH[name] ?: return null
                  val mode = parts.getOrNull(1)?.lowercase() ?: return null
                  val major = when {
                      mode.startsWith("maj") -> true
                      mode.startsWith("min") -> false
                      else -> return null
                  }
                  val relativeMajor = if (major) pitch else (pitch + 3) % 12
                  val number = ((relativeMajor * 7) % 12 + 7) % 12 + 1
                  return number to major
              }

              /** How alike the outgoing outro and the incoming intro are in loudness, each against its own song's peak. */
              internal fun energyScore(previous: TrackAnalysis, next: TrackAnalysis): Double? {
                  val end = previous.contentEndTime.takeIf { it.isFinite() && it > 0 } ?: previous.duration
                  val outro = windowLevel(previous.energyCurve, end - ENERGY_WINDOW_SECONDS, end) ?: return null
                  val start = next.audibleStartTime.orZero()
                  val intro = windowLevel(next.energyCurve, start, start + ENERGY_WINDOW_SECONDS) ?: return null
                  return 1.0 - min(1.0, abs(outro - intro) * 1.5)
              }

              private fun windowLevel(curve: List<EnergySample>, from: Double, to: Double): Double? {
                  if (curve.size < 4) return null
                  val peak = curve.maxOf { it.energy }
                  if (!(peak > 0.0)) return null
                  val inside = curve.filter { it.time >= from && it.time <= to }
                  if (inside.isEmpty()) return null
                  return inside.sumOf { it.energy } / inside.size / peak
              }

              private fun vocalScore(previous: TrackAnalysis, next: TrackAnalysis): Double =
                  if (previous.vocalProbability >= VOCAL_BOTH_SING && next.vocalProbability >= VOCAL_BOTH_SING) 0.4 else 1.0
          }
