                      val started = playbackTime >= cut.transitionStart
                      return cut.copy(
                          shouldStart = started,
                          policyReasons = policy.reasons + "unmixable-pair",
                          reason = if (started) cut.reason else "before-${cut.reason}",
                      )
                  }
          '''),
          ])

