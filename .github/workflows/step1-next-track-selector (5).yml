               r'''TransitionStyle.EQUAL_POWER -> if (plan.reason.contains("-cut-")) "Automix · cut mix $whenText · ${plan.reason.substringAfterLast("-")}$noLoop" else "Automix · crossfading $whenText'''),
          ])

