          package com.music.bitchord.playback.smart

          import kotlin.math.abs
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertNotNull
          import kotlin.test.assertNull
          import kotlin.test.assertTrue

          class TransitionRepertoireTest {

              /** A synthetic, fully analysed track on a steady grid, with a shaped energy curve. */
              private fun track(
                  id: String,
                  bpm: Double,
                  key: String,
                  vocal: Double,
                  duration: Double = 200.0,
                  energy: (Double) -> Double = { 1.0 },
              ): TrackAnalysis {
                  val beat = 60.0 / bpm
                  val downbeats = generateSequence(0.5) { it + 4 * beat }.takeWhile { it < duration - 1 }.toList()
                  val curve = (0 until (duration * 2).toInt()).map { EnergySample(it / 2.0, energy(it / 2.0)) }
                  return TrackAnalysis(
                      status = TrackAnalysis.STATUS_READY,
                      trackId = id,
                      duration = duration,
                      bpm = bpm,
                      beatInterval = beat,
                      beatConfidence = 0.9,
                      downbeats = downbeats,
                      phraseBoundaries = downbeats.filterIndexed { index, _ -> index % 8 == 0 },
                      firstBeat = 0.5,
                      key = key,
                      keyConfidence = 0.9,
                      audibleStartTime = 0.5,
                      contentEndTime = duration - 2,
                      mixInTime = downbeats[4],
                      energyCurve = curve,
                      vocalProbability = vocal,
                  )
              }

              private fun cutPlan(
                  current: TrackAnalysis,
                  next: TrackAnalysis,
                  advanced: Boolean = true,
              ): TransitionPlan? = TransitionRepertoire.plan(
                  analysis = current,
                  nextAnalysis = next,
                  length = current.duration,
                  nextLength = next.duration,
                  finalMixAnchor = current.contentEndTime,
                  advanced = advanced,
              )

              private fun onGrid(downbeats: List<Double>, time: Double) = downbeats.any { abs(it - time) < 1e-6 }

              @Test
              fun loudIntoLoudIsCutOnTheDownbeats() {
                  val current = track("a", 120.0, "C major", vocal = 0.9)
                  val next = track("b", 94.0, "F♯ major", vocal = 0.9)
                  val plan = assertNotNull(cutPlan(current, next))
                  assertEquals("smart-cut-quick", plan.reason)
                  assertEquals(TransitionStyle.EQUAL_POWER, plan.transitionStyle)
                  assertTrue(plan.fadeSeconds <= 0.5 + 1e-6, "a cut is short: ${plan.fadeSeconds}s")
                  assertTrue(onGrid(current.downbeats, plan.transitionEnd), "leaves on an outgoing downbeat")
                  assertTrue(
                      onGrid(next.downbeats, plan.incomingCueTime + plan.fadeSeconds),
                      "the incoming downbeat lands on the exit",
                  )
                  assertEquals(0.0, plan.echoSeconds)
              }

              @Test
              fun aQuietIntroGetsAnEchoOut() {
                  val current = track("a", 120.0, "C major", vocal = 0.1)
                  val next = track("b", 94.0, "C major", vocal = 0.1) { if (it < 12.0) 0.2 else 1.0 }
                  val plan = assertNotNull(cutPlan(current, next))
                  assertEquals("smart-cut-echo", plan.reason)
                  assertEquals(0.5, plan.echoSeconds, 1e-6)
                  assertEquals(0.5, plan.beatSeconds, 1e-6)
                  assertEquals(4.0, plan.fadeSeconds, 1e-6)
                  assertTrue(onGrid(current.downbeats, plan.transitionEnd))
                  assertTrue(
                      current.duration - plan.transitionEnd >= echoTailSeconds(plan.echoSeconds),
                      "the repeats need outgoing file to ring in",
                  )
              }

              @Test
              fun theEchoNeedsAdvancedAndHonoursItsSwitch() {
                  val current = track("a", 120.0, "C major", vocal = 0.1)
                  val next = track("b", 94.0, "C major", vocal = 0.1) { if (it < 12.0) 0.2 else 1.0 }
                  assertNull(cutPlan(current, next, advanced = false))
                  TransitionRepertoire.echoCutEnabled = false
                  try {
                      assertEquals(0.0, cutPlan(current, next)?.echoSeconds ?: 0.0)
                  } finally {
                      TransitionRepertoire.echoCutEnabled = true
                  }
              }

              @Test
              fun twoSingersAreNeverEchoed() {
                  val current = track("a", 120.0, "C major", vocal = 0.9)
                  val next = track("b", 94.0, "C major", vocal = 0.9) { if (it < 12.0) 0.2 else 1.0 }
                  assertEquals(0.0, cutPlan(current, next)?.echoSeconds ?: 0.0)
              }

              @Test
              fun aDropIsCutTo() {
                  val current = track("a", 120.0, "C major", vocal = 0.9)
                  val base = track("b", 94.0, "F♯ major", vocal = 0.9) { if (it < 20.5) 0.3 else 1.0 }
                  val dropAt = base.downbeats[10]
                  val next = base.copy(
                      mixInTime = dropAt,
                      mixInCandidates = listOf(MixCandidate(dropAt, 1.0, "main_drop")),
                  )
                  val plan = assertNotNull(cutPlan(current, next))
                  assertEquals("smart-cut-drop", plan.reason)
                  assertEquals(dropAt, plan.incomingCueTime + plan.fadeSeconds, 1e-6)
                  assertTrue(plan.incomingHandoffTime <= 0.25 * next.duration + 1e-6)
              }

              @Test
              fun aQuietOutgoingEndIsLeftToTheCrossfade() {
                  val current = track("a", 120.0, "C major", vocal = 0.9) { if (it < 150.0) 1.0 else 0.2 }
                  val next = track("b", 94.0, "F♯ major", vocal = 0.9)
                  assertNull(cutPlan(current, next))
              }

              @Test
              fun withoutAReliableGridNothingIsCut() {
                  val current = track("a", 120.0, "C major", vocal = 0.9).copy(beatConfidence = 0.1)
                  val next = track("b", 94.0, "F♯ major", vocal = 0.9)
                  assertNull(cutPlan(current, next))
              }

              // The planner end to end: the same unmixable pair, with and without the repertoire.

              private fun planned(current: TrackAnalysis, next: TrackAnalysis, advanced: Boolean) = planTransition(
                  analysis = current,
                  nextAnalysis = next,
                  currentTrack = TransitionTrackInfo(current.trackId, (current.duration * 1000).toLong()),
                  nextTrack = TransitionTrackInfo(next.trackId, (next.duration * 1000).toLong()),
                  currentTime = 10.0,
                  duration = current.duration,
                  mode = CrossfadeMode.SMART,
                  advanced = advanced,
              )

              @Test
              fun thePlannerCutsAnUnmixablePairOnlyInAdvancedMode() {
                  val current = track("a", 120.0, "C major", vocal = 0.9)
                  val next = track("b", 94.0, "F♯ major", vocal = 0.9)

                  val advanced = planned(current, next, advanced = true)
                  assertTrue(advanced.reason.contains("smart-cut"), "advanced: ${advanced.reason}")
                  assertTrue("unmixable-pair" in advanced.policyReasons)

                  val classic = planned(current, next, advanced = false)
                  assertEquals("before-unmixable-crossfade", classic.reason)
                  assertEquals(current.contentEndTime, classic.transitionEnd, 1e-6)

                  TransitionRepertoire.enabled = false
                  try {
                      assertEquals("before-unmixable-crossfade", planned(current, next, advanced = true).reason)
                  } finally {
                      TransitionRepertoire.enabled = true
                  }
              }
          }
