              )

              /** Runs [block] with the overlap engine and the echo gesture on, whatever the build's defaults are. */
              private inline fun <T> overlapOn(enabled: Boolean = true, block: () -> T): T {
                  val before = OverlapMix.enabled
                  val echoBefore = TransitionRepertoire.echoCutEnabled
                  OverlapMix.enabled = enabled
                  TransitionRepertoire.echoCutEnabled = true
                  try {
                      return block()
                  } finally {
                      OverlapMix.enabled = before
                      TransitionRepertoire.echoCutEnabled = echoBefore
                  }
              }

              private fun overlapOf(current: TrackAnalysis, next: TrackAnalysis): OverlapMix.Plan? {
                  val plan = cut(current, next) ?: return null
                  return OverlapMix.fromCut(plan, current, next, current.duration, next.duration)
              }

              @Test
              fun aQuickCutBecomesAnOverlapMixOnTheSameEdges() = overlapOn {
                  val current = track("a", 120.0, "C major", vocal = 0.9)
                  val next = track("b", 94.0, "F♯ major", vocal = 0.9)
                  val cutPlan = assertNotNull(cut(current, next))
                  val overlap = assertNotNull(OverlapMix.fromCut(cutPlan, current, next, current.duration, next.duration))
                  assertEquals(CutGesture.QUICK_CUT, overlap.gesture)
                  assertEquals(OverlapMix.TAKEOVER_LEAD_SECONDS, overlap.cutStart, 1e-9)
                  // The mix's clock puts the move on the planner's own edges.
                  assertEquals(cutPlan.transitionStart, overlap.takeover + overlap.cutStart, 1e-9)
                  assertEquals(cutPlan.transitionEnd, overlap.takeover + overlap.cutEnd, 1e-9)
                  assertEquals(cutPlan.incomingCueTime, overlap.inCue, 1e-9)
                  assertTrue(!overlap.echo)
                  assertEquals(0.0, overlap.tail)
              }

              @Test
              fun anEchoOutKeepsItsDelayAndItsTail() = overlapOn {
