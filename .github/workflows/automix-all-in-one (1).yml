          set -euo pipefail
          g++ -std=c++17 -O1 -I native -I native/third_party/signalsmith-stretch -I native/third_party/signalsmith-linear -I native/third_party \
            native/loopmix/tests/echo_test.cpp native/loopmix/loop_mix_renderer.cpp -o /tmp/echo_test
          /tmp/echo_test


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

