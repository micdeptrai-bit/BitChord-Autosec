          cat > 'app/src/main/java/com/music/bitchord/playback/AutoplaySequencer.kt' <<'KT_EOF'
          package com.music.bitchord.playback

          import android.util.Log
          import com.music.bitchord.data.model.Song
          import com.music.bitchord.playback.smart.NextTrackSelector
          import com.music.bitchord.playback.smart.TrackAnalysis
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          /**
           * Orders an AutoPlay batch so each song follows the last one the way a DJ
           * would: matching tempo, compatible key, similar energy at the join.
           *
           * It only reads analysis that already exists (the playing track's, and any
           * candidate analysed in an earlier session). A candidate nothing has measured
           * is left where the radio put it, so with no evidence this is a no-op and
           * never makes the queue worse. It never starts an analysis.
           *
           * The playback service installs [analysisLookup]; until then, and after the
           * service is destroyed, [sequence] returns the radio's order untouched.
           */
          object AutoplaySequencer {

              private const val TAG = "BitChordSequencer"

              /** Stored analysis for a track id (the queue item's media id), or null when there is none. Blocking; called off the main thread. */
              @Volatile
              var analysisLookup: ((String) -> TrackAnalysis?)? = null

              /** Master switch. No settings UI yet: flip here to turn the whole feature off. */
              @Volatile
              var enabled: Boolean = true

              /**
               * [candidates] reordered to follow [after] (the track the new songs will be
               * queued behind). Returns [candidates] unchanged when there is nothing to
               * go on or anything goes wrong.
               */
              suspend fun sequence(after: Song, candidates: List<Song>): List<Song> {
                  val lookup = analysisLookup
                  if (!enabled || lookup == null || candidates.size < 2) return candidates
                  return try {
                      withContext(Dispatchers.IO) {
                          val previous = lookup(after.videoId)?.takeIf { it.isUsable }
                              ?: return@withContext candidates
                          val scored = NextTrackSelector.chain(
                              previous,
                              candidates.map { NextTrackSelector.Candidate(it, lookup(it.videoId)) },
                          )
                          val known = scored.count { it.known }
                          if (known > 0) {
                              Log.i(
                                  TAG,
                                  "after=${after.videoId} known=$known/${scored.size} top=" +
                                      scored.take(3).joinToString { "${it.item.videoId}(${it.detail})" },
                              )
                          }
                          scored.map { it.item }
                      }
                  } catch (cancelled: CancellationException) {
                      throw cancelled
                  } catch (failure: Exception) {
                      Log.w(TAG, "sequencing failed, keeping radio order: ${failure.message}")
                      candidates
                  }
              }
          }
          KT_EOF
