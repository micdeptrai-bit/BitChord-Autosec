          package com.music.bitchord.playback.smart

          import kotlin.math.abs
          import kotlin.math.ln
          import kotlin.math.min
          import kotlin.math.roundToInt

          /**
           * Picks which song should follow which, the way a DJ builds a set: tempo that
           * can be matched, a key that does not clash, a similar energy at the join, and
           * no two sung songs laid over each other.
           *
           * Pure: no audio, no players, no I/O. It reads stored [TrackAnalysis] and
           * returns an order. A candidate with no usable analysis is *unknown*, not bad:
           * it scores [UNKNOWN_MIX], so tracks nothing has measured yet stay in the order
           * the radio gave them, and measured ones only move when the evidence is clear.
           *
           * The radio's own order is relevance (what YouTube thinks fits the seed), so it
           * is kept as a gentle tie-breaker: each position down the list costs
           * [RANK_PENALTY], capped at [MAX_RANK_PENALTY].
           */
          object NextTrackSelector {

              const val WEIGHT_TEMPO = 0.40
              const val WEIGHT_KEY = 0.30
              const val WEIGHT_ENERGY = 0.15
              const val WEIGHT_VOCAL = 0.15

              /** What a candidate with no usable analysis scores. */
              const val UNKNOWN_MIX = 0.5

              /** Score lost per position down the radio's list, up to [MAX_RANK_PENALTY]. */
              const val RANK_PENALTY = 0.012
              const val MAX_RANK_PENALTY = 0.3

              const val MIN_KEY_CONFIDENCE = 0.25

              /** Both songs at or above this vocal probability: sung over sung. Same value the planner uses. */
              const val VOCAL_BOTH_SING = 0.62

              /** How much of the outgoing outro and incoming intro the energy comparison looks at. */
              const val ENERGY_WINDOW_SECONDS = 30.0

              /** Tempo score kept when either beat grid is below [MIN_BEATMATCH_CONFIDENCE]: no beatmatch, at best DJ-assisted. */
              private const val UNTRUSTED_GRID_FACTOR = 0.6

              /** A candidate and what is stored about it ([analysis] null or unusable = unknown). */
              data class Candidate<T>(val item: T, val analysis: TrackAnalysis?)

              class Mix(val value: Double, val detail: String)

              data class Scored<T>(
                  val item: T,
                  /** 0..1, how well it follows the previous song; [UNKNOWN_MIX] when not measured. */
                  val mix: Double,
                  val known: Boolean,
                  /** [mix] minus the rank penalty: what the order is sorted by. */
                  val score: Double,
                  val detail: String,
              )

              /**
               * [candidates] (given in the radio's relevance order) sorted by how well
               * each follows [previous]. Stable: equal scores keep their given order.
               * A null or unusable [previous] leaves the order untouched.
               */
              fun <T> order(previous: TrackAnalysis?, candidates: List<Candidate<T>>): List<Scored<T>> {
                  val scored = candidates.mapIndexed { index, candidate ->
                      val analysis = candidate.analysis
                      val known = previous != null && previous.isUsable && analysis != null && analysis.isUsable
                      val mix = if (known) mixOf(previous!!, analysis!!) else Mix(UNKNOWN_MIX, "unknown")
                      val penalty = min(MAX_RANK_PENALTY, index * RANK_PENALTY)
                      Scored(candidate.item, mix.value, known, mix.value - penalty, mix.detail)
                  }
                  return scored.sortedByDescending { it.score }
              }

              /**
               * Greedy chain: the best follower of [previous], then the best follower of
               * that one, and so on until every candidate is placed. Where the chosen
               * song is unknown the chain loses its footing and the rest keep radio order.
               */
              fun <T> chain(previous: TrackAnalysis?, candidates: List<Candidate<T>>): List<Scored<T>> {
                  val remaining = candidates.toMutableList()
                  val result = ArrayList<Scored<T>>(candidates.size)
                  var current = previous
                  while (remaining.isNotEmpty()) {
                      val best = order(current, remaining).first()
                      val at = remaining.indexOfFirst { it.item === best.item || it.item == best.item }
                      val taken = remaining.removeAt(at)
                      result.add(best)
                      current = taken.analysis?.takeIf { it.isUsable }
                  }
                  return result
              }

              internal fun mixOf(previous: TrackAnalysis, next: TrackAnalysis): Mix {
                  val names = ArrayList<String>()
                  val scores = ArrayList<Double>()
                  val weights = ArrayList<Double>()
                  fun part(name: String, score: Double?, weight: Double) {
                      if (score == null) return
                      names.add(name)
                      scores.add(score)
                      weights.add(weight)
                  }
                  part("tempo", tempoScore(previous, next), WEIGHT_TEMPO)
                  part("key", keyScore(trustedKey(previous), trustedKey(next)), WEIGHT_KEY)
                  part("energy", energyScore(previous, next), WEIGHT_ENERGY)
                  part("vocal", vocalScore(previous, next), WEIGHT_VOCAL)
                  var weighted = 0.0
                  var total = 0.0
                  for (i in scores.indices) {
                      weighted += scores[i] * weights[i]
                      total += weights[i]
                  }
                  val value = if (total > 0) weighted / total else UNKNOWN_MIX
                  val detail = names.indices.joinToString(" ") { "${names[it]}=${(scores[it] * 100).roundToInt()}" }
                  return Mix(value, detail)
              }

              /** 1.0 for the same tempo (octave-folded), falling as the stretch needed grows; ~0 beyond the stretch window. */
              internal fun tempoScore(previous: TrackAnalysis, next: TrackAnalysis): Double? {
                  val rate = incomingRateBetween(previous.bpm, next.bpm)
                  if (!rate.isFinite()) return null
                  val deviation = abs(ln(rate))
                  val base = when {
                      deviation <= 0.03 -> 1.0
                      deviation <= 0.07 -> 0.85
                      stretchReachable(previous.bpm, next.bpm) -> {
                          // Slowing a song down is the direction that sounds worse.
                          val weighted = if (rate < 1.0) deviation * 1.5 else deviation
                          0.7 - ((weighted - 0.07) / 0.16).coerceIn(0.0, 1.0) * 0.4
                      }
                      else -> 0.05
                  }
                  val trusted = previous.beatConfidence >= MIN_BEATMATCH_CONFIDENCE &&
                      next.beatConfidence >= MIN_BEATMATCH_CONFIDENCE
                  return if (trusted) base else base * UNTRUSTED_GRID_FACTOR
              }

              private fun trustedKey(analysis: TrackAnalysis): String =
                  if (analysis.key.isBlank() || analysis.keyConfidence < MIN_KEY_CONFIDENCE) "" else analysis.key

              /**
               * Distance on the Camelot wheel: the same key and its relative major/minor
               * are 0 and 1 steps apart, a neighbour on the wheel is 1, a diagonal is 2.
               * Null when either key is missing or unreadable.
               */
              internal fun keyScore(left: String, right: String): Double? {
                  val a = camelot(left) ?: return null
                  val b = camelot(right) ?: return null
                  val around = abs(a.first - b.first)
                  val steps = min(around, 12 - around) + if (a.second != b.second) 1 else 0
                  return when (steps) {
                      0 -> 1.0
                      1 -> 0.9
                      2 -> 0.6
                      3 -> 0.3
                      else -> 0.1
                  }
              }

              private val PITCH = mapOf(
                  "C" to 0, "C♯" to 1, "D♭" to 1, "D" to 2, "D♯" to 3, "E♭" to 3,
                  "E" to 4, "F" to 5, "F♯" to 6, "G♭" to 6, "G" to 7, "G♯" to 8,
                  "A♭" to 8, "A" to 9, "A♯" to 10, "B♭" to 10, "B" to 11,
              )

              /** Camelot number 1..12 and whether the key is major (B), or null for a key it cannot read. */
              internal fun camelot(key: String): Pair<Int, Boolean>? {
                  val parts = key.trim().split(' ').filter { it.isNotEmpty() }
                  val raw = parts.getOrNull(0)?.replace('#', '♯') ?: return null
                  val name = if (raw.length == 2 && raw[1] == 'b') raw.substring(0, 1) + "♭" else raw
                  val pitch = PITCH[name] ?: return null
                  val mode = parts.getOrNull(1)?.lowercase() ?: return null
                  val major = when {
                      mode.startsWith("maj") -> true
                      mode.startsWith("min") -> false
                      else -> return null
                  }
                  val relativeMajor = if (major) pitch else (pitch + 3) % 12
                  val number = ((relativeMajor * 7) % 12 + 7) % 12 + 1
                  return number to major
              }

              /** How alike the outgoing outro and the incoming intro are in loudness, each against its own song's peak. */
              internal fun energyScore(previous: TrackAnalysis, next: TrackAnalysis): Double? {
                  val end = previous.contentEndTime.takeIf { it.isFinite() && it > 0 } ?: previous.duration
                  val outro = windowLevel(previous.energyCurve, end - ENERGY_WINDOW_SECONDS, end) ?: return null
                  val start = next.audibleStartTime.orZero()
                  val intro = windowLevel(next.energyCurve, start, start + ENERGY_WINDOW_SECONDS) ?: return null
                  return 1.0 - min(1.0, abs(outro - intro) * 1.5)
              }

              private fun windowLevel(curve: List<EnergySample>, from: Double, to: Double): Double? {
                  if (curve.size < 4) return null
                  val peak = curve.maxOf { it.energy }
                  if (!(peak > 0.0)) return null
                  val inside = curve.filter { it.time >= from && it.time <= to }
                  if (inside.isEmpty()) return null
                  return inside.sumOf { it.energy } / inside.size / peak
              }

              private fun vocalScore(previous: TrackAnalysis, next: TrackAnalysis): Double =
                  if (previous.vocalProbability >= VOCAL_BOTH_SING && next.vocalProbability >= VOCAL_BOTH_SING) 0.4 else 1.0
          }
          KT_EOF
          mkdir -p "$(dirname 'shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/NextTrackSelectorTest.kt')"
          cat > 'shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/NextTrackSelectorTest.kt' <<'KT_EOF'
          package com.music.bitchord.playback.smart

          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertNotNull
          import kotlin.test.assertNull
          import kotlin.test.assertTrue

          class NextTrackSelectorTest {

              private fun track(
                  id: String,
                  bpm: Double,
                  key: String,
                  vocal: Double = 0.1,
                  duration: Double = 200.0,
                  level: Double = 1.0,
              ): TrackAnalysis {
                  val energy = (0 until (duration * 2).toInt()).map { EnergySample(it / 2.0, level) }
                  return TrackAnalysis(
                      status = TrackAnalysis.STATUS_READY,
                      trackId = id,
                      duration = duration,
                      bpm = bpm,
                      beatInterval = 60.0 / bpm,
                      beatConfidence = 0.9,
                      key = key,
                      keyConfidence = 0.9,
                      audibleStartTime = 0.5,
                      contentEndTime = duration - 2,
                      energyCurve = energy,
                      vocalProbability = vocal,
                  )
              }

              private fun cand(id: String, analysis: TrackAnalysis?) = NextTrackSelector.Candidate(id, analysis)

              @Test
              fun camelotWheelMatchesTheStandardChart() {
                  assertEquals(8 to false, NextTrackSelector.camelot("A minor"))
                  assertEquals(8 to true, NextTrackSelector.camelot("C major"))
                  assertEquals(9 to true, NextTrackSelector.camelot("G major"))
                  assertEquals(7 to false, NextTrackSelector.camelot("D minor"))
                  assertEquals(1 to true, NextTrackSelector.camelot("B major"))
                  assertEquals(5 to false, NextTrackSelector.camelot("C minor"))
                  assertEquals(NextTrackSelector.camelot("A♭ major"), NextTrackSelector.camelot("Ab major"))
                  assertEquals(NextTrackSelector.camelot("C♯ minor"), NextTrackSelector.camelot("C# minor"))
                  assertNull(NextTrackSelector.camelot(""))
                  assertNull(NextTrackSelector.camelot("H major"))
              }

              @Test
              fun relativeMajorAndMinorAreClose() {
                  assertEquals(1.0, NextTrackSelector.keyScore("C major", "C major"))
                  assertEquals(0.9, NextTrackSelector.keyScore("C major", "A minor"))
                  assertEquals(0.9, NextTrackSelector.keyScore("C major", "G major"))
                  assertTrue(NextTrackSelector.keyScore("C major", "F♯ major")!! <= 0.1 + 1e-9)
                  assertNull(NextTrackSelector.keyScore("", "C major"))
              }

              @Test
              fun tempoFoldsOctavesAndRejectsFarPairs() {
                  val base = track("a", 120.0, "C major")
                  assertEquals(1.0, NextTrackSelector.tempoScore(base, track("b", 121.0, "C major"))!!, 1e-9)
                  assertEquals(1.0, NextTrackSelector.tempoScore(base, track("b", 60.0, "C major"))!!, 1e-9)
                  assertEquals(0.05, NextTrackSelector.tempoScore(base, track("b", 175.0, "C major"))!!, 1e-9)
                  val mid = NextTrackSelector.tempoScore(base, track("b", 130.0, "C major"))!!
                  assertTrue(mid > 0.3 && mid < 0.7)
              }

              @Test
              fun anUntrustedGridCostsTempoScore() {
                  val a = track("a", 120.0, "C major")
                  val b = track("b", 120.0, "C major").copy(beatConfidence = 0.2)
                  assertEquals(0.6, NextTrackSelector.tempoScore(a, b)!!, 1e-9)
              }

              @Test
              fun aPerfectFollowerScoresOne() {
                  val a = track("a", 120.0, "C major")
                  val b = track("b", 120.0, "C major")
                  assertEquals(1.0, NextTrackSelector.mixOf(a, b).value, 1e-9)
              }

              @Test
              fun twoSungSongsScoreLowerThanSungThenInstrumental() {
                  val a = track("a", 120.0, "C major", vocal = 0.9)
                  val sung = track("b", 120.0, "C major", vocal = 0.9)
                  val quiet = track("c", 120.0, "C major", vocal = 0.1)
                  assertTrue(NextTrackSelector.mixOf(a, sung).value < NextTrackSelector.mixOf(a, quiet).value)
              }

              @Test
              fun withNoEvidenceTheRadioOrderIsKept() {
                  val prev = track("p", 120.0, "C major")
                  val ids = listOf("a", "b", "c", "d")
                  val out = NextTrackSelector.order(prev, ids.map { cand(it, null) })
                  assertEquals(ids, out.map { it.item })
                  assertTrue(out.none { it.known })
                  val noPrev = NextTrackSelector.order(null, ids.map { cand(it, track(it, 120.0, "C major")) })
                  assertEquals(ids, noPrev.map { it.item })
              }

              @Test
              fun aGoodMeasuredFollowerJumpsAheadOfUnknowns() {
                  val prev = track("p", 120.0, "C major")
                  val list = listOf(
                      cand("u1", null), cand("u2", null), cand("u3", null),
                      cand("good", track("good", 121.0, "A minor")),
                  )
                  assertEquals("good", NextTrackSelector.order(prev, list).first().item)
              }

              @Test
              fun aMeasuredClashFallsBehindUnknowns() {
                  val prev = track("p", 120.0, "C major")
                  val list = listOf(
                      cand("bad", track("bad", 175.0, "F♯ major", vocal = 0.9)),
                      cand("u1", null),
                      cand("u2", null),
                  )
                  val out = NextTrackSelector.order(prev, list).map { it.item }
                  assertEquals("bad", out.last())
              }

              @Test
              fun chainIsAPermutationAndFollowsTheBestMatch() {
                  val prev = track("p", 120.0, "C major")
                  val list = listOf(
                      cand("far", track("far", 175.0, "F♯ major")),
                      cand("near", track("near", 122.0, "G major")),
                      cand("unknown", null),
                  )
                  val out = NextTrackSelector.chain(prev, list)
                  assertEquals(setOf("far", "near", "unknown"), out.map { it.item }.toSet())
                  assertEquals(3, out.size)
                  assertEquals("near", out.first().item)
                  assertNotNull(out.first().detail)
              }
          }
