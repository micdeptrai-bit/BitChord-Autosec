          #!/usr/bin/env python3
          """Gắn TransitionRepertoire vào TransitionPlanner.kt, nhãn UI trong CrossfadeController.kt,
          và chỉnh test cũ AdvancedAutomixPlannerTest (nó ghim hành vi crossfade phẳng của cặp unmixable).
