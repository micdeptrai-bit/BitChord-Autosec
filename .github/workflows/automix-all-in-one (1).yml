      - name: Vá renderer native, LoopMix.Clock, LoopMixSession và CrossfadeController (bước 3)
        if: ${{ inputs.mix_layer }}
        run: python3 .github/step3-patch.py

      - name: Đặt công tắc overlap_engine
        if: ${{ inputs.mix_layer }}
        shell: bash
        run: |
          set -euo pipefail
          F='shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/OverlapMix.kt'
          sed -i "s/var enabled: Boolean = false/var enabled: Boolean = ${{ inputs.overlap_engine }}/" "$F"
          grep -n "var enabled" "$F"

