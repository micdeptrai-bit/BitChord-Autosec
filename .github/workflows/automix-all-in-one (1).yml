               "      mixLeft_[n] += l * g;\n      mixRight_[n] += r * g;\n",
               "      float echoOutL = 0.f, echoOutR = 0.f;\n"
               "      if (echoOn) {\n"
               "        const float send = s0 + (s1 - s0) * (float(i) / count);\n"
               "        const int p = deck.echoPos;\n"
               "        echoOutL = deck.echoL[p];\n"
               "        echoOutR = deck.echoR[p];\n"
               "        deck.echoL[p] = l * send + echoOutL * deck.echoFeedback;\n"
               "        deck.echoR[p] = r * send + echoOutR * deck.echoFeedback;\n"
               "        if (++deck.echoPos >= int(deck.echoL.size())) deck.echoPos = 0;\n"
