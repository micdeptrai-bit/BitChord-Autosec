               "JNIEXPORT void JNICALL\n"
               "Java_com_music_bitchord_playback_loopmix_LoopMixRenderer_nativeSetEcho(JNIEnv*, jclass, jlong handle, jint index,\n"
               "                                                                     jdouble delaySeconds, jfloat feedback,\n"
