            echo "- Test: ${{ inputs.run_tests }} | APK: ${{ inputs.build_apk }}"
            echo "- Logcat bước 3a: tag BitChordOverlapMix và dòng \"overlap ...\" của CrossfadeController; bước 1: tag BitChordSequencer"
