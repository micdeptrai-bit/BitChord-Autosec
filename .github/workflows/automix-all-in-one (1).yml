          package com.music.bitchord.playback.loopmix

          import android.util.Log
          import com.music.bitchord.playback.smart.LoopMix
          import com.music.bitchord.playback.smart.OverlapMix
          import kotlin.math.max

          /**
           * Builds a [LoopMixSession] for an [OverlapMix] (a cut or echo-out): the same
           * renderer, ports and controller path as the loop mix, with two decks that
           * don't loop and don't stretch. The outgoing song hands over to its deck at
           * [OverlapMix.Plan.takeover]; the incoming deck is already running, silent,
           * when the move starts; the renderer does the gain curve and the echo.
           */
          object OverlapMixSession {
              private const val TAG = "BitChordOverlapMix"

              /** Seconds of each song decoded either side of what its deck plays. */
              private const val PREROLL_SECONDS = 1.0
              private const val TAIL_SECONDS = 3.0

              /** The incoming deck starts this many mix seconds before the move, so its first audible sample is settled. */
              private const val IN_LEAD_SECONDS = 0.6

              /** Blocking: call off the main thread. [decode] returns track seconds from..to at [sampleRate], or null. */
              fun build(
                  plan: OverlapMix.Plan,
                  outId: String,
                  inId: String,
                  sampleRate: Int,
                  inLevel: Float,
                  decode: (side: LoopMix.Side, from: Double, to: Double) -> LoopRegion?,
              ): LoopMixSession? {
                  if (!LoopMixRenderer.available || sampleRate <= 0) return null
                  val clock = OverlapMix.Clock(plan)
                  val outRegion = decode(
                      LoopMix.Side.OUT,
                      plan.takeover - PREROLL_SECONDS,
                      plan.takeover + plan.cutEnd + plan.tail + 0.5,
                  ) ?: return null
                  val inFrom = max(0.0, plan.inCue - IN_LEAD_SECONDS - PREROLL_SECONDS)
                  val inRegion = decode(LoopMix.Side.IN, inFrom, clock.elementTrackTime + TAIL_SECONDS) ?: return null
                  if (outRegion.start > plan.takeover || inRegion.start > inFrom + 0.05) {
                      Log.w(TAG, "a region starts too late: out ${outRegion.start}, in ${inRegion.start}")
                      return null
                  }
                  val renderer = LoopMixRenderer(sampleRate)
                  if (!renderer.isValid) return null
                  val sr = sampleRate.toDouble()

                  fun samplesOf(region: LoopRegion, trackSeconds: Double) = (trackSeconds - region.start) * sr

                  // Outgoing: plain playback from the takeover, through the move and the echo's tail. It stops after.
                  val outEnd = clock.releaseAt + plan.tail
                  renderer.setDeck(
                      LoopMixRenderer.OUT,
                      LoopMixRenderer.DeckSetup(
                          left = outRegion.left,
                          right = outRegion.right,
                          regionStart = outRegion.start,
                          loopStart = 0L,
                          loopEnd = 0L,
                          releaseAt = 1e18,
                          knotFrames = doubleArrayOf(0.0, outEnd * sr),
                          knotPositions = doubleArrayOf(samplesOf(outRegion, plan.takeover), samplesOf(outRegion, plan.takeover + outEnd)),
                          runOn = false,
                          stopAt = outEnd + 0.05,
                          preroll = 0.4,
                          level = 1f,
                      ),
                  )
                  // Incoming: running from just before the move at rate 1, and on past the last knot. No loop:
                  // releaseAt 0 makes "track second -> deck position" a plain offset for the fade-out at the handover.
                  val inStart = plan.cutStart - IN_LEAD_SECONDS
                  renderer.setDeck(
                      LoopMixRenderer.IN,
                      LoopMixRenderer.DeckSetup(
                          left = inRegion.left,
                          right = inRegion.right,
                          regionStart = inRegion.start,
                          loopStart = 0L,
                          loopEnd = 0L,
                          releaseAt = 0.0,
                          knotFrames = doubleArrayOf(inStart * sr, clock.elementAt * sr),
                          knotPositions = doubleArrayOf(
                              samplesOf(inRegion, plan.inCue - IN_LEAD_SECONDS),
                              samplesOf(inRegion, clock.elementTrackTime),
                          ),
                          runOn = true,
                          stopAt = clock.elementAt + 2.0,
                          preroll = 0.4,
                          level = inLevel,
                      ),
                  )
                  val outGain = OverlapMix.outGain(plan, LoopMix.HANDOVER_SEC)
                  renderer.setEnvelope(LoopMixRenderer.OUT, LoopMixRenderer.KIND_GAIN, outGain.times, outGain.values)
                  val inGain = OverlapMix.inGain(plan)
                  renderer.setEnvelope(LoopMixRenderer.IN, LoopMixRenderer.KIND_GAIN, inGain.times, inGain.values)
                  OverlapMix.echoSend(plan)?.let { send ->
                      renderer.setEcho(LoopMixRenderer.OUT, plan.echoSeconds, OverlapMix.ECHO_FEEDBACK, OverlapMix.ECHO_RETURN)
                      renderer.setEnvelope(LoopMixRenderer.OUT, LoopMixRenderer.KIND_ECHO_SEND, send.times, send.values)
                  }
                  renderer.prepare()
                  // The incoming deck hands over to its own player at the same track position.
                  renderer.setFadeOut(LoopMixRenderer.IN, clock.elementTrackTime)
                  Log.d(TAG, "built ${plan.gesture.reason}: takeover ${"%.2f".format(plan.takeover)}s, move ${"%.2f".format(plan.cutStart)}..${"%.2f".format(plan.cutEnd)}s")
                  return LoopMixSession(null, clock, outId, inId, renderer, sampleRate).also {
                      it.label = "${plan.gesture.reason.removePrefix("smart-cut-")} cut"
                      it.planIncomingStart()
                  }
              }
          }
          KT_EOF
          mkdir -p "$(dirname 'native/loopmix/tests/echo_test.cpp')"
          cat > 'native/loopmix/tests/echo_test.cpp' <<'CPP_EOF'
          // Host test for the loop mix renderer's echo: a short tone burst through a deck with a feedback
          // delay must come back after the delay, quieter by the feedback each time, and the repeats must
          // keep ringing after the send closes and the dry gain is zero. Built and run by the workflow.
          #include <cmath>
          #include <cstdio>
          #include <vector>

          #include "loopmix/loop_mix_renderer.h"

          using bitchord::loopmix::Renderer;

          static double rms(const std::vector<float>& left, int from, int to) {
            double sum = 0;
            for (int i = from; i < to; ++i) sum += double(left[i]) * left[i];
            return std::sqrt(sum / std::max(1, to - from));
          }

          int main() {
            const int sr = 48000;
            const double delay = 0.5;
            const float feedback = 0.5f;
            const float ret = 0.8f;
            const int regionFrames = sr * 12;
            std::vector<float> tone(regionFrames, 0.f);
            // A 0.2 s burst of 220 Hz starting at 2.0 s of the region.
            for (int i = 0; i < int(0.2 * sr); ++i) {
              tone[2 * sr + i] = 0.5f * float(std::sin(2 * 3.14159265358979 * 220.0 * i / sr));
            }

            Renderer renderer(sr);
            auto& deck = renderer.deck(0);
            deck.left = tone;
            deck.right = tone;
            deck.regionStart = 0;
            deck.loopStart = 0;
            deck.loopEnd = 0;
            deck.releaseAt = 1e18;
            // Mix t0 = region second 0; rate 1 for 10 s.
            deck.knotTimes = {0.0, 10.0 * sr};
            deck.knotPositions = {0.0, 10.0 * sr};
            deck.runOn = false;
            deck.stopAt = 10.0;
            deck.preroll = 0.4;
            deck.level = 1.f;
            // Dry gain 1 until 2.5 s, then 0 (the burst has ended: only the repeats are left).
            deck.gain.times = {0.0, 2.5, 2.51};
            deck.gain.values = {1.f, 1.f, 0.f};
            // Echo send 1 until 2.3 s then closed: the repeats must ring on by themselves.
            deck.echoSend.times = {0.0, 2.3, 2.35};
            deck.echoSend.values = {1.f, 1.f, 0.f};
            deck.echoDelaySeconds = delay;
            deck.echoFeedback = feedback;
            deck.echoReturn = ret;
            renderer.prepare();

            const int64_t first = renderer.firstFrame();
            const int total = sr * 8;
            std::vector<float> interleaved(2 * 1024);
            std::vector<float> left;
            int64_t frame = first;
            while (frame < total) {
              renderer.render(frame, interleaved.data(), 1024);
              for (int i = 0; i < 1024; ++i) left.push_back(interleaved[2 * i]);
              frame += 1024;
            }
            auto at = [&](double seconds) { return int(std::llround(seconds * sr) - first); };
            const double dry = rms(left, at(2.02), at(2.18));
            const double e1 = rms(left, at(2.0 + delay + 0.02), at(2.0 + delay + 0.18));
            const double e2 = rms(left, at(2.0 + 2 * delay + 0.02), at(2.0 + 2 * delay + 0.18));
            const double e3 = rms(left, at(2.0 + 3 * delay + 0.02), at(2.0 + 3 * delay + 0.18));
            const double gap = rms(left, at(2.0 + 0.25 + 0.02), at(2.0 + delay - 0.02));
            const double later = rms(left, at(7.0), at(7.8));
            std::printf("dry=%.4f e1=%.4f e2=%.4f e3=%.4f gap=%.5f later=%.5f\n", dry, e1, e2, e3, gap, later);

            int failures = 0;
            auto expect = [&](bool ok, const char* what) {
              if (!ok) {
                std::printf("FAIL: %s\n", what);
                ++failures;
              }
            };
            expect(dry > 0.2, "the dry burst is heard");
            expect(std::fabs(e1 / dry - ret) < 0.08, "first repeat is the return level of the dry burst");
            expect(std::fabs(e2 / e1 - feedback) < 0.08, "second repeat is feedback times the first");
            expect(std::fabs(e3 / e2 - feedback) < 0.08, "third repeat is feedback times the second");
            expect(gap < 0.02 * dry, "silence between the dry burst and its first repeat");
            expect(later < 0.001, "the tail has died away by the end");

            // A deck with no echo set must render exactly what it did before the echo existed.
            Renderer plain(sr);
            auto& d = plain.deck(0);
            d.left = tone; d.right = tone;
            d.knotTimes = {0.0, 10.0 * sr}; d.knotPositions = {0.0, 10.0 * sr};
            d.stopAt = 10.0;
            plain.prepare();
            std::vector<float> out(2 * 1024);
            double energy = 0;
            for (int64_t f = plain.firstFrame(); f < sr * 3; f += 1024) {
              plain.render(f, out.data(), 1024);
              for (float v : out) energy += double(v) * v;
            }
            expect(energy > 1.0, "a deck without echo still plays");
            std::printf(failures == 0 ? "echo test OK\n" : "echo test FAILED\n");
            return failures == 0 ? 0 : 1;
          }
