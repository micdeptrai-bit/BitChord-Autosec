          # ---- 4. CrossfadeController: nhánh overlap + đọc timeline ---------------------------------------
          OVERLAP_BRANCH = '''        // Native engine (OverlapMix): a cut / echo-out the planner chose is rendered by the same
                  // sink-side renderer as the loop mix (sample-exact, one clock) instead of two players and
                  // volume ramps. Off unless OverlapMix.enabled; any refusal leaves the planner's own path.
                  overlapPlanFor(
                      player, currentItem, nextItem, plan, currentAnalysis, nextAnalysis, duration, nextDuration, analysisState,
                  )?.let { overlap ->
                      if (nextStreamReady(nextItem)) {
                          val takeoverMs = (overlap.takeover * 1000).roundToLong()
                          AppSettings.smartTransitionWindow.value = TransitionWindow(
                              start = (plan.transitionStart * 1000.0 / duration).toFloat().coerceIn(0f, 1f),
                              end = (plan.transitionEnd * 1000.0 / duration).toFloat().coerceIn(0f, 1f),
                          )
                          if (markerOnly) return
                          plannedTransition = currentItem.mediaId to takeoverMs
                          holdAhead(player, duration)
                          if (takeoverMs - player.currentPosition > LOOP_ARM_LEAD_MS) return
                          beginOverlap(player, overlap, currentItem, nextItem, duration, nextDuration)
                          return
                      }
                  }

          '''

          OVERLAP_FUNCS = '''    // ---- Overlap mix (native engine for cuts and echo-outs) -----------------------------------

              private var overlapBlockedPair: String? = null
              private var overlapActivePair: String? = null
              private var lastOverlapVerdict = ""

              /** The overlap mix for a cut the planner chose, or null (switch off, no cut, or the pair can't take it). */
              private fun overlapPlanFor(
                  player: ExoPlayer,
                  current: MediaItem,
                  next: MediaItem,
                  plan: TransitionPlan,
                  currentAnalysis: TrackAnalysis,
                  nextAnalysis: TrackAnalysis,
                  durationMs: Long,
                  nextDurationMs: Long,
                  state: SmartAnalysis,
              ): OverlapMix.Plan? {
                  if (!OverlapMix.enabled || plan.blocked || !plan.reason.contains("smart-cut")) return null
                  val pair = "${current.mediaId}->${next.mediaId}"
                  if (pair == overlapBlockedPair) return null
                  val refusal = loopRefusalFor(player, current, next, state)
                  val overlap = if (refusal == null) {
                      OverlapMix.fromCut(plan, currentAnalysis, nextAnalysis, durationMs / 1000.0, nextDurationMs / 1000.0)
                  } else {
                      null
                  }
                  val tooLate = overlap != null && overlap.takeover * 1000 - player.currentPosition < OVERLAP_MIN_LEAD_MS
                  val verdict = "$pair: " + when {
                      refusal != null -> "no overlap mix ($refusal)"
                      overlap == null -> "no overlap mix (planner's cut doesn't fit)"
                      tooLate -> "no overlap mix (too late to set up)"
                      else -> "overlap mix ${overlap.gesture.reason} at ${"%.2f".format(Locale.ROOT, overlap.takeover)}s"
                  }
                  if (verdict != lastOverlapVerdict) {
                      lastOverlapVerdict = verdict
                      Log.d(TAG, "overlap $verdict")
                  }
                  return overlap?.takeIf { !tooLate }
              }

              /** Builds the two decks off the main thread, then arms the sinks exactly as the loop mix does. */
              private fun beginOverlap(
                  out: ExoPlayer,
                  plan: OverlapMix.Plan,
                  outItem: MediaItem,
                  inItem: MediaItem,
                  durationMs: Long,
                  nextDurationMs: Long,
              ) {
                  val into = standby()
                  if (out === into) return
                  val nextIndex = out.nextMediaItemIndex
                  if (nextIndex == C.INDEX_UNSET) return
                  val outPort = loopPortOf(out) ?: return
                  val inPort = loopPortOf(into) ?: return
                  endEase(clickless = false)
                  phase = Phase.LOOP_ARMING
                  smartFadeActive = true
                  handedOff = false
                  outgoing = out
                  incoming = into
                  outgoingItemIndex = out.currentMediaItemIndex
                  armDeadline = SystemClock.elapsedRealtime() + LOOP_BUILD_TIMEOUT_MS
                  overlapActivePair = "${outItem.mediaId}->${inItem.mediaId}"
                  holdAtEnd(out)
                  val sampleRate = outPort.sampleRate
                  val inLevel = (loudnessGain(inItem.mediaId) / loudnessGain(outItem.mediaId))
                      .takeIf { it.isFinite() && it > 0f } ?: 1f
                  Log.d(
                      TAG,
                      "overlap build ${outItem.mediaId}->${inItem.mediaId} (${plan.gesture.reason}) at ${sampleRate}Hz, " +
                          "takeover at ${"%.2f".format(Locale.ROOT, plan.takeover)}s, playhead ${out.currentPosition}ms",
                  )
                  loopBuildJob = scope.launch {
                      val began = SystemClock.elapsedRealtime()
                      val session = withContext(Dispatchers.Default) {
                          runCatching {
                              OverlapMixSession.build(plan, outItem.mediaId, inItem.mediaId, sampleRate, inLevel) { side, from, to ->
                                  if (side == LoopMix.Side.OUT) {
                                      loopRegion(outItem, durationMs, from, to, sampleRate)
                                  } else {
                                      loopRegion(inItem, nextDurationMs, from, to, sampleRate)
                                  }
                              }
                          }.onFailure { Log.w(TAG, "overlap build failed", it) }.getOrNull()
                      }
                      if (phase != Phase.LOOP_ARMING || outgoing !== out) {
                          session?.close()
                          return@launch
                      }
                      if (session == null) {
                          loopFallBack("the overlap decks would not build")
                          return@launch
                      }
                      Log.d(TAG, "overlap decks built in ${SystemClock.elapsedRealtime() - began}ms")
                      armLoop(session, out, into, nextIndex, outPort, inPort)
                  }
              }

          '''

          patch(APP / "CrossfadeController.kt", [
