          import pathlib, sys

          def patch(path, edits):
              text = path.read_text(encoding="utf-8")
              for label, old, new in edits:
                  if new in text:
                      print(f"[bỏ qua] {path.name}: {label} (đã có)")
                      continue
                  n = text.count(old)
                  if n != 1:
                      sys.exit(f"LỖI: {path.name}: '{label}' tìm thấy {n} chỗ (cần đúng 1). Code gốc đã đổi, cần chỉnh lại patch.")
                  text = text.replace(old, new)
                  print(f"[ok] {path.name}: {label}")
              path.write_text(text, encoding="utf-8")

          SMART = pathlib.Path("shared/src/commonMain/kotlin/com/music/bitchord/playback/smart")
          TEST = pathlib.Path("shared/src/commonTest/kotlin/com/music/bitchord/playback/smart")
          APP = pathlib.Path("app/src/main/java/com/music/bitchord/playback")

          patch(SMART / "TransitionPlanner.kt", [
              ("cắt thay cho crossfade phẳng ở cặp unmixable",
               r'''    if (isUnmixablePair(analysis, nextAnalysis)) {
          ''',
               r'''    if (isUnmixablePair(analysis, nextAnalysis)) {
                  // Advanced Automix: a downbeat cut / cut to the drop / echo-out beats two loud
                  // unsynced songs laid over each other. Null means "no evidence", and the plain
                  // crossfade below runs exactly as before.
                  TransitionRepertoire.plan(
                      analysis = analysis,
                      nextAnalysis = nextAnalysis,
                      length = length,
                      nextLength = nextLength,
                      finalMixAnchor = finalMixAnchor,
                      advanced = advanced,
                  )?.takeIf { playbackTime < it.transitionEnd - 0.05 }?.let { cut ->
                      val started = playbackTime >= cut.transitionStart
                      return cut.copy(
                          shouldStart = started,
                          policyReasons = policy.reasons + "unmixable-pair",
                          reason = if (started) cut.reason else "before-${cut.reason}",
                      )
                  }
          '''),
          ])

          patch(APP / "CrossfadeController.kt", [
              ("nhãn UI cho kiểu cắt",
               r'''TransitionStyle.EQUAL_POWER -> "Automix · crossfading $whenText''',
               r'''TransitionStyle.EQUAL_POWER -> if (plan.reason.contains("-cut-")) "Automix · cut mix $whenText · ${plan.reason.substringAfterLast("-")}$noLoop" else "Automix · crossfading $whenText'''),
          ])

          patch(TEST / "AdvancedAutomixPlannerTest.kt", [
              ("test unmixable chạy với repertoire tắt",
               r'''        val plan = plan(current, next, advanced = true)
                  assertEquals(TransitionStyle.EQUAL_POWER, plan.transitionStyle)
                  assertEquals(current.contentEndTime, plan.transitionEnd, 1e-6)''',
               r'''        // The cut repertoire (TransitionRepertoireTest) is switched off here: this pins the
                  // plain crossfade it falls back to when it has no evidence.
                  TransitionRepertoire.enabled = false
                  val plan = try {
                      plan(current, next, advanced = true)
                  } finally {
                      TransitionRepertoire.enabled = true
                  }
                  assertEquals(TransitionStyle.EQUAL_POWER, plan.transitionStyle)
                  assertEquals(current.contentEndTime, plan.transitionEnd, 1e-6)'''),
          ])
