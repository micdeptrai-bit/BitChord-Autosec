          package com.music.bitchord.playback.smart

          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertNotNull
          import kotlin.test.assertNull
          import kotlin.test.assertTrue

          class OverlapMixTest {

              private fun track(
                  id: String,
                  bpm: Double,
                  key: String,
                  vocal: Double,
                  duration: Double = 200.0,
                  energy: (Double) -> Double = { 1.0 },
              ): TrackAnalysis {
                  val beat = 60.0 / bpm
                  val downbeats = generateSequence(0.5) { it + 4 * beat }.takeWhile { it < duration - 1 }.toList()
                  val curve = (0 until (duration * 2).toInt()).map { EnergySample(it / 2.0, energy(it / 2.0)) }
                  return TrackAnalysis(
                      status = TrackAnalysis.STATUS_READY,
                      trackId = id,
                      duration = duration,
                      bpm = bpm,
                      beatInterval = beat,
                      beatConfidence = 0.9,
                      downbeats = downbeats,
                      phraseBoundaries = downbeats.filterIndexed { index, _ -> index % 8 == 0 },
                      firstBeat = 0.5,
                      key = key,
                      keyConfidence = 0.9,
                      audibleStartTime = 0.5,
                      contentEndTime = duration - 2,
                      mixInTime = downbeats[4],
                      energyCurve = curve,
                      vocalProbability = vocal,
                  )
              }

              private fun cut(current: TrackAnalysis, next: TrackAnalysis): TransitionPlan? = TransitionRepertoire.plan(
                  analysis = current,
                  nextAnalysis = next,
                  length = current.duration,
                  nextLength = next.duration,
                  finalMixAnchor = current.contentEndTime,
                  advanced = true,
              )

              /** Runs [block] with the overlap engine and the echo gesture on, whatever the build's defaults are. */
              private inline fun <T> overlapOn(enabled: Boolean = true, block: () -> T): T {
                  val before = OverlapMix.enabled
                  val echoBefore = TransitionRepertoire.echoCutEnabled
                  OverlapMix.enabled = enabled
                  TransitionRepertoire.echoCutEnabled = true
                  try {
                      return block()
                  } finally {
                      OverlapMix.enabled = before
                      TransitionRepertoire.echoCutEnabled = echoBefore
                  }
              }

              private fun overlapOf(current: TrackAnalysis, next: TrackAnalysis): OverlapMix.Plan? {
                  val plan = cut(current, next) ?: return null
                  return OverlapMix.fromCut(plan, current, next, current.duration, next.duration)
              }

              @Test
              fun aQuickCutBecomesAnOverlapMixOnTheSameEdges() = overlapOn {
                  val current = track("a", 120.0, "C major", vocal = 0.9)
                  val next = track("b", 94.0, "F♯ major", vocal = 0.9)
                  val cutPlan = assertNotNull(cut(current, next))
                  val overlap = assertNotNull(OverlapMix.fromCut(cutPlan, current, next, current.duration, next.duration))
                  assertEquals(CutGesture.QUICK_CUT, overlap.gesture)
                  assertEquals(OverlapMix.TAKEOVER_LEAD_SECONDS, overlap.cutStart, 1e-9)
                  // The mix's clock puts the move on the planner's own edges.
                  assertEquals(cutPlan.transitionStart, overlap.takeover + overlap.cutStart, 1e-9)
                  assertEquals(cutPlan.transitionEnd, overlap.takeover + overlap.cutEnd, 1e-9)
                  assertEquals(cutPlan.incomingCueTime, overlap.inCue, 1e-9)
                  assertTrue(!overlap.echo)
                  assertEquals(0.0, overlap.tail)
              }

              @Test
              fun anEchoOutKeepsItsDelayAndItsTail() = overlapOn {
                  val current = track("a", 120.0, "C major", vocal = 0.1)
                  val next = track("b", 94.0, "C major", vocal = 0.1) { if (it < 12.0) 0.2 else 1.0 }
                  val overlap = assertNotNull(overlapOf(current, next))
                  assertEquals(CutGesture.ECHO_CUT, overlap.gesture)
                  assertEquals(0.5, overlap.echoSeconds, 1e-9)
                  assertEquals(echoTailSeconds(0.5), overlap.tail, 1e-9)
                  val send = assertNotNull(OverlapMix.echoSend(overlap))
                  assertEquals(0f, send.values.first())
                  assertEquals(0f, send.values.last())
                  assertTrue(send.times.last() > overlap.cutEnd, "the send closes after the overlap, so the repeats ring on")
                  assertTrue(send.times.toList().zipWithNext().all { (a, b) -> b >= a }, "times rise")
              }

              @Test
              fun offWhenSwitchedOffAndForPlansThatAreNotCuts() {
                  val current = track("a", 120.0, "C major", vocal = 0.9)
                  val next = track("b", 94.0, "F♯ major", vocal = 0.9)
                  val cutPlan = assertNotNull(cut(current, next))
                  overlapOn(enabled = false) {
                      assertNull(OverlapMix.fromCut(cutPlan, current, next, current.duration, next.duration))
                  }
                  overlapOn {
                      assertNull(OverlapMix.fromCut(cutPlan.copy(reason = "before-unmixable-crossfade"), current, next, 200.0, 200.0))
                      assertNull(OverlapMix.fromCut(cutPlan.copy(blocked = true), current, next, 200.0, 200.0))
                      assertNotNull(OverlapMix.fromCut(cutPlan, current, next, current.duration, next.duration))
                  }
              }

              @Test
              fun anEchoTailThatWouldRunPastTheFileIsRefused() = overlapOn {
                  val current = track("a", 120.0, "C major", vocal = 0.1)
                  val next = track("b", 94.0, "C major", vocal = 0.1) { if (it < 12.0) 0.2 else 1.0 }
                  val cutPlan = assertNotNull(cut(current, next))
                  assertNotNull(OverlapMix.fromCut(cutPlan, current, next, current.duration, next.duration))
                  assertNull(OverlapMix.fromCut(cutPlan, current, next, cutPlan.transitionEnd + 0.5, next.duration))
              }

              @Test
              fun aSongTooShortAfterTheHandoverIsRefused() = overlapOn {
                  val current = track("a", 120.0, "C major", vocal = 0.9)
                  val next = track("b", 94.0, "F♯ major", vocal = 0.9)
                  val cutPlan = assertNotNull(cut(current, next))
                  assertNull(OverlapMix.fromCut(cutPlan, current, next, current.duration, cutPlan.incomingCueTime + 6.0))
              }

              @Test
              fun theClockHandsOverInTheMiddleOfTheMoveAndTheIncomingPlayerTakesOverAfter() = overlapOn {
                  val overlap = assertNotNull(overlapOf(track("a", 120.0, "C major", 0.9), track("b", 94.0, "F♯ major", 0.9)))
                  val clock = OverlapMix.Clock(overlap)
                  assertEquals(overlap.takeover, clock.takeoverSeconds)
                  assertTrue(clock.handoffAt > overlap.cutStart && clock.handoffAt < overlap.cutEnd)
                  assertTrue(clock.elementAt > overlap.cutEnd)
                  // The incoming player's track position at its takeover continues the deck's, at rate 1.
                  assertEquals(overlap.inCue + (clock.elementAt - overlap.cutStart), clock.elementTrackTime, 1e-9)
                  assertEquals(overlap.inCue, clock.positionAt(LoopMix.Side.IN, overlap.cutStart)!!, 1e-9)
                  assertEquals(clock.elementTrackTime, clock.positionAt(LoopMix.Side.IN, clock.elementAt)!!, 1e-9)
                  assertEquals(overlap.takeover, clock.positionAt(LoopMix.Side.OUT, 0.0)!!, 1e-9)
                  assertNull(clock.positionAt(LoopMix.Side.IN, overlap.cutStart - 1.0))
                  assertNull(clock.positionAt(LoopMix.Side.OUT, -0.1))
                  assertNull(clock.positionAt(LoopMix.Side.OUT, overlap.cutEnd + overlap.tail + 0.1))
              }

              @Test
              fun theBeatClockRisesAndCoversTheWholeMix() = overlapOn {
                  val overlap = assertNotNull(overlapOf(track("a", 120.0, "C major", 0.9), track("b", 94.0, "F♯ major", 0.9)))
                  val clock = OverlapMix.Clock(overlap)
                  assertEquals(0.0, clock.beatTimes.first())
                  assertTrue(clock.beatTimes.size >= 2)
                  assertTrue(clock.beatTimes.toList().zipWithNext().all { (a, b) -> b > a })
                  assertTrue(clock.beatTimes.last() >= clock.elementAt)
                  assertEquals(-1, clock.beatAt(-0.5).first)
                  assertEquals(0, clock.beatAt(0.1).first)
                  // Before the move the beat is the outgoing song's (0.5 s), after it the incoming song's.
                  assertEquals(0.5, clock.beatTimes[1] - clock.beatTimes[0], 1e-9)
                  val late = clock.beatAt(clock.elementAt).first
                  assertEquals(60.0 / 94.0, clock.beatTimes[late + 1] - clock.beatTimes[late], 1e-9)
              }

              @Test
              fun theGainCurvesAreEqualPowerAndMeetAtTheHandoverEdges() = overlapOn {
                  val overlap = assertNotNull(overlapOf(track("a", 120.0, "C major", 0.9), track("b", 94.0, "F♯ major", 0.9)))
                  val out = OverlapMix.outGain(overlap, LoopMix.HANDOVER_SEC)
                  val inn = OverlapMix.inGain(overlap)
                  assertEquals(0f, out.values.first())
                  assertEquals(1f, out.values[1])
                  assertEquals(0f, out.values.last())
                  assertEquals(0f, inn.values.first())
                  assertEquals(1f, inn.values.last())
                  assertTrue(out.times.toList().zipWithNext().all { (a, b) -> b >= a })
                  assertTrue(inn.times.toList().zipWithNext().all { (a, b) -> b >= a })
                  // At every point inside the move the two gains carry (nearly) constant power.
                  val span = overlap.cutEnd - overlap.cutStart
                  for (step in 1 until 8) {
                      val t = overlap.cutStart + span * step / 8
                      val o = out.values[out.times.indexOfFirst { abs(it - t) < 1e-9 }]
                      val i = inn.values[inn.times.indexOfFirst { abs(it - t) < 1e-9 }]
                      assertEquals(1.0, (o * o + i * i).toDouble(), 1e-5, "power at step $step")
                      assertEquals(cos(PI / 2 * step / 8), o.toDouble(), 1e-5)
                      assertEquals(sin(PI / 2 * step / 8), i.toDouble(), 1e-5)
                  }
              }
          }
