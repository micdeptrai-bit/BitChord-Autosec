          #!/usr/bin/env python3
          """Gắn bộ chọn bài vào Autoplay.kt và PlaybackService.kt bằng cách thay đúng chuỗi.
          Nếu một chuỗi gốc không còn (hoặc xuất hiện nhiều lần) thì DỪNG và báo rõ, không sửa dở."""
          import pathlib, sys

          BASE = pathlib.Path("app/src/main/java/com/music/bitchord/playback")

          def patch(path, edits):
              text = path.read_text(encoding="utf-8")
              for label, old, new in edits:
                  if new in text:
                      print(f"[bỏ qua] {path.name}: {label} (đã có)")
                      continue
                  n = text.count(old)
                  if n != 1:
                      sys.exit(f"LỖI: {path.name}: '{label}' tìm thấy {n} chỗ (cần đúng 1). Code gốc đã đổi, cần chỉnh lại patch.")
                  text = text.replace(old, new)
                  print(f"[ok] {path.name}: {label}")
              path.write_text(text, encoding="utf-8")

          patch(BASE / "Autoplay.kt", [
              ("tham số after",
               "    limit: Int = MAX_QUEUED_AUTOPLAY,\n): Result<List<Song>> {",
               "    limit: Int = MAX_QUEUED_AUTOPLAY,\n    /** The track the new songs will be queued behind, when that is not [seedSong]. */\n    after: Song? = null,\n): Result<List<Song>> {"),
              ("sắp xếp trước khi extend",
               "    val extra = QueueBuilder.extend(existing, related, limit, preferVideos = videos)",
               "    val sequenced = AutoplaySequencer.sequence(after ?: seedSong, related)\n    val extra = QueueBuilder.extend(existing, sequenced, limit, preferVideos = videos)"),
          ])

          patch(BASE / "PlaybackService.kt", [
              ("cài lookup analysis",
               "    private val trackAnalyzer = com.music.bitchord.playback.smart.TrackAnalyzer(this, AudioCache)\n",
               "    private val trackAnalyzer = com.music.bitchord.playback.smart.TrackAnalyzer(this, AudioCache)\n\n"
               "    /** Read-only view of the analyses already on disk, for AutoPlay's next-track ordering. */\n"
               "    private val sequencerStore = com.music.bitchord.playback.smart.AnalysisStore { filesDir }\n\n"
               "    init {\n"
               "        AutoplaySequencer.analysisLookup = { id ->\n"
               "            trackAnalyzer.analysisFor(id).takeIf { it.isUsable } ?: sequencerStore.load(id)?.takeIf { it.isUsable }\n"
               "        }\n"
               "    }\n"),
              ("gỡ lookup khi huỷ service",
               "        trackAnalyzer.release()\n",
               "        AutoplaySequencer.analysisLookup = null\n        trackAnalyzer.release()\n"),
              ("truyền bài cuối hàng đợi",
               "                val result = loadAutoplayTracks(existing, seedSong, remaining)\n",
               "                val result = loadAutoplayTracks(existing, seedSong, remaining, after = queueSongs.lastOrNull())\n"),
          ])
          PY_EOF

