          patch(LOOPMIX / "LoopMixRenderer.kt", [
              ("setEcho",
               "    fun prepare() = nativePrepare(handle)\n",
               "    /** Echo on deck [index]: a feedback delay of [delaySeconds]; its send level is the [KIND_ECHO_SEND] envelope. */\n"
               "    fun setEcho(index: Int, delaySeconds: Double, feedback: Float, returnLevel: Float) =\n"
               "        nativeSetEcho(handle, index, delaySeconds, feedback, returnLevel)\n\n"
               "    fun prepare() = nativePrepare(handle)\n"),
              ("KIND_ECHO_SEND",
               "        const val KIND_HIGH_PASS_HZ = 2\n",
               "        const val KIND_HIGH_PASS_HZ = 2\n        const val KIND_ECHO_SEND = 3\n"),
              ("khai báo nativeSetEcho",
               "        @JvmStatic private external fun nativePrepare(handle: Long)\n",
               "        @JvmStatic private external fun nativeSetEcho(\n"
