               "    const float g1 = deck.gain.empty() ? 1.f : deck.gain.at(t1);\n",
               "    const float g1 = deck.gain.empty() ? 1.f : deck.gain.at(t1);\n"
               "    const bool echoOn = !deck.echoL.empty();\n"
               "    const float s0 = echoOn && !deck.echoSend.empty() ? deck.echoSend.at(t0) : 0.f;\n"
               "    const float s1 = echoOn && !deck.echoSend.empty() ? deck.echoSend.at(t1) : 0.f;\n"),
