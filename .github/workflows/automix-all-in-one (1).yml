               "    const int echoLen = deck.echoDelaySeconds > 0 ? int(std::lround(deck.echoDelaySeconds * sampleRate_)) : 0;\n"
               "    deck.echoL.assign(echoLen, 0.f);\n"
               "    deck.echoR.assign(echoLen, 0.f);\n"
               "    deck.echoPos = 0;\n"),
