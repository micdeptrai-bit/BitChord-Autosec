name: "Automix v6 + Canvas + màn hình khóa + AI DJ bước 1-3 (MỘT FILE, build APK)"

# ======================================================================================
# MỘT FILE gộp tất cả tính năng Automix/Canvas/màn hình khóa. Chạy tay: Actions -> chọn workflow -> Run workflow.
# Nguyên nhân "mất tính năng": main KHÔNG chứa các tính năng này. Chúng chỉ nằm trong patch của workflow,
# áp lúc build vào bản sao tạm. Workflow step1-next-track-selector build thẳng từ main trơn nên APK không có chúng.
#
# FILE NÀY ÁP THEO THỨ TỰ (tất cả vào bản sao tạm trên máy chủ, KHÔNG commit gì vào repo):
#   1. Automix v2-v6: Mix style (Cân bằng/Chill/Club/Radio), bảng Mix, BPM/key Camelot, công tắc Spotify Canvas,
#      loop mix, hiệu ứng thanh tua/âm lượng        (patch nhúng từ automix-v6-visualizer)
#   2. Trình phát màn hình khóa                       (patch nhúng từ automix-v6-visualizer)
#   3. Bước 1-3 AI DJ: bộ chọn bài kế tiếp, kiểu cắt quick/drop/echo, engine overlap native (tắt/bật bằng mix_layer)
#
# CÔNG TẮC
#   mix_layer      : bật bước 1-3 (mục 3). Nếu build lỗi, chạy lại với false để có đúng bản v6 + màn hình khóa đã build được.
#   echo_cut       : bật kiểu ECHO_CUT. Tắt nếu nghe dở.
#   overlap_engine : engine overlap native cho các kiểu cắt. Mặc định TẮT.
#   run_tests      : chạy toàn bộ test module shared. Test fail KHÔNG chặn build APK (xem artifact test-log).
#   build_apk      : build APK dev benchmark arm64 (R8 + baseline profile, ký khoá debug, gói com.dev.bitchord.benchmark).
# Đừng chạy chung với workflow automix-* / lockscreen-* / step1-* khác: file này đã chứa sẵn.
# Nếu build lỗi: tải artifact "build-log" (chỉ có khi lỗi) rồi gửi lại để sửa.
# ======================================================================================

on:
  workflow_dispatch:
    inputs:
      mix_layer:
        description: "Cài bước 1-3 AI DJ (chọn bài, kiểu cắt, engine overlap) lên trên v6 + màn hình khóa. Tắt nếu build lỗi"
        type: boolean
        default: true
      echo_cut:
        description: "Bật kiểu ECHO_CUT (echo-out đè lên intro êm). Tắt nếu nghe dở"
        type: boolean
        default: true
      overlap_engine:
        description: "Render các kiểu cắt bằng renderer native (một clock, echo thật). Mặc định tắt"
        type: boolean
        default: false
      run_tests:
        description: "Chạy toàn bộ test module shared (lâu hơn; test fail không chặn build APK)"
        type: boolean
        default: false
      build_apk:
        description: "Build APK dev benchmark arm64"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4


      - name: Apply the combined changes
        run: |
          echo "" | base64 -d | tar -xz
          patch -p1 --no-backup-if-mismatch < automix-dj-base.patch
          rm automix-dj-base.patch

