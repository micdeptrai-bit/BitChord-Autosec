               "        loopPlanned = null\n        loopRefusal = reason\n        overlapBlockedPair = overlapActivePair\n        loopBail(reason, settle = false)\n"),
              ("nhãn stage cho overlap",
               "                m < session.clock.releaseAt -> \"looping\"\n                else -> \"letting go\"\n",
               "                m < session.clock.releaseAt -> if (session.plan == null) \"mixing\" else \"looping\"\n"
               "                else -> if (session.plan == null) \"ringing out\" else \"letting go\"\n"),
              ("hằng số OVERLAP_MIN_LEAD_MS",
               "        const val LOOP_MIN_LEAD_MS = 9_000L\n",
               "        const val LOOP_MIN_LEAD_MS = 9_000L\n\n        /** An overlap mix is only set up while its takeover is at least this far ahead. */\n        const val OVERLAP_MIN_LEAD_MS = 6_000L\n"),
          ])
