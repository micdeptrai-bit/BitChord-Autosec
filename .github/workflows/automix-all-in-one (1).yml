               "    val takeoverUs: Long = (clock.takeoverSeconds * 1_000_000).roundToLong()\n\n"
               "    /** What the stats line calls this mix when it has no loop plan to describe. */\n"
               "    var label: String = \"overlap mix\"\n"),
