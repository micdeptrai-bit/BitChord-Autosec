          package com.music.bitchord.playback.smart

          /**
           * What the sink-side renderer's mix looks like to everything that is not the
           * renderer: the controller (when to start the incoming player, when the app
           * moves to the new song, where the scrubber is) and the session (where the
           * outgoing sink takes over). Both [LoopMix.Clock] and [OverlapMix.Clock] are one,
           * so one controller path can run either kind of mix.
           *
           * Every time is mix seconds, 0 being the moment the outgoing song reaches
           * [takeoverSeconds] and the sink crosses over to the renderer.
           */
          interface MixTimeline {
              /** Track second of the outgoing song at mix t0: where the sink splices. */
              val takeoverSeconds: Double

              /** Beat k of the mix, seconds after t0; at least two entries. Drives the scrubber's pulse only. */
              val beatTimes: DoubleArray

              /** The app moves to the incoming song here. */
              val handoffAt: Double

              /** The outgoing deck is done being the main sound here. */
              val releaseAt: Double

              /** The incoming player takes over here, at track second [elementTrackTime]. */
              val elementAt: Double
              val elementTrackTime: Double

              /** The beat [t] falls in and how far through it (0..1); k = -1 before t0. */
              fun beatAt(t: Double): Pair<Int, Double>

              /** Where [side]'s song is [t] seconds after t0, or null where it isn't sounding from a deck. */
              fun positionAt(side: LoopMix.Side, t: Double): Double?
          }
