# ===== BUOC 1: dan vao workflow Lockscreen, SAU buoc ap patch lockscreen,
#       TRUOC buoc 'Set up JDK' (hoac truoc buoc build dau tien) =====
      - name: Apply AI Mix + ML + toggle patch
        run: |
          echo "" | base64 -d | tar -xz
          if ! patch -p1 --dry-run < ai-mix-ml-toggle.patch > /dev/null; then
            echo "::error::Patch khong ap duoc. Repo co the da co AI Mix hoac file bi sua so voi ban goc."
            patch -p1 --dry-run < ai-mix-ml-toggle.patch || true
            exit 1
          fi
          patch -p1 < ai-mix-ml-toggle.patch
          rm ai-mix-ml-toggle.patch

# ===== BUOC 2 (tuy chon): dan TRUOC buoc build APK de chay test AI Mix =====
      - name: AI Mix tests (engine + model)
        id: aimix_tests
        continue-on-error: true
        run: ./gradlew :shared:jvmTest --tests "*AiMix*"
