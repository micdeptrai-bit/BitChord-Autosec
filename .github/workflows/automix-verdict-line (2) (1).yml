name: Automix - dòng trạng thái loop mix + gom cài đặt (APK)

# Chạy tay: tab Actions -> chọn workflow này -> Run workflow.
# Một file duy nhất, KHÔNG commit gì vào repo (trừ khi bật "push_branch").
#
# NỀN: bản APK thật của bạn (Phong cách mix, Độ mạnh tay, Thời điểm mix, Kiểu nối khi lệch nhịp,
# Độ rộng loop, Phân tích sâu, nút Mix, màn hình khóa, engine native...) KHÔNG nằm trong main: nó nằm
# trong patch nhúng của automix-all-in-one (2).yml. Nên workflow này làm 3 việc theo thứ tự:
#   0. Dựng lại đúng chuỗi đó: đọc file .github/workflows/<chain_file> trong repo và chạy các bước áp patch
#      của nó (mọi công tắc ở mặc định = bật hết). Nếu main sau này đã chứa sẵn các tính năng đó
#      (có file AutomixMixStyle.kt) thì bỏ qua bước này.
#   1. Patch 1 - dòng trạng thái loop mix trên màn hình phát (viết lại cho khớp bản all-in-one).
#   2. Patch 2A - gom cài đặt Automix (đề xuất 2, phần A): chỉ sắp xếp lại giao diện, KHÔNG đổi hành vi.
# Cả hai patch là diff dạng chữ thường nằm ngay dưới, đọc và duyệt được từng dòng.
#
# Patch 1 làm gì: dòng chữ nhỏ ở chân ảnh bìa, chỉ hiện khi sắp tới lúc chuyển bài (45 giây cuối), KHÔNG
# cần bật "Stats for nerds" (hiện dưới dòng BPM/key):
#   - "Loop mix sau 12 giây" / "Đang mix: loop cả hai bài"
#   - "Không loop: cuối bài này không có đoạn không lời" (hoặc đầu bài sau)
#   - "Không loop: chưa dò được nhịp", tốc độ phát khác 1x, đang bật bỏ qua đoạn im lặng,
#     hẹn giờ tắt, bài phân tích từ bản thu khác, thiết bị phát không hỗ trợ, v.v.
# Chữ có tiếng Việt và tiếng Anh; các ngôn ngữ khác tạm hiện tiếng Anh.
#
# Patch 2A làm gì (Cài đặt -> Phát nhạc -> Automix, khi Automix bật):
#   Công tắc Automix -> Phong cách mix -> Hiệu năng Automix -> "Nâng cao" (gập lại, mặc định đóng).
#   Trong "Nâng cao": Thời điểm mix, Kiểu nối khi lệch nhịp, Độ rộng của loop mix, Phân tích sâu, Độ mạnh tay.
#   Tìm kiếm trong Cài đặt vẫn thấy các nút bên trong dù đang gập. Giá trị đã chọn giữ nguyên.
#   (Phần B: gộp Phân tích sâu vào Hiệu năng cao; phần C: Phong cách mix 3 mức - chưa làm.)
#
# File đụng tới: CrossfadeController.kt, AppSettings.kt, AndroidPlayerHost.kt, PlayerHost.kt,
# PlayerControls.kt, SettingsSheet.kt, hai strings.xml của sharedUi (en, vi), hai strings.xml của app
# (en, vi) và file mới AutomixVerdict.kt. Đừng chạy chung với workflow automix-* khác: bản này đã chứa sẵn.

on:
  workflow_dispatch:
    inputs:
      chain_file:
        description: "Tên file workflow trong .github/workflows chứa chuỗi all-in-one cần dựng lại"
        type: string
        default: "automix-all-in-one (2).yml"
      run_tests:
        description: "Chạy test của module shared trước khi build"
        type: boolean
        default: false
      build_apk:
        description: "Build APK dev benchmark (R8 + baseline profile, ký bằng khoá debug)"
        type: boolean
        default: true
      push_branch:
        description: "Đẩy bản đã vá sang nhánh automix-verdict-line (để bạn mở PR). Tắt = không commit gì"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: automix-verdict-line-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verdict-line:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIX_BRANCH: automix-verdict-line
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild the all-in-one features
        shell: bash
        env:
          CHAIN_FILE: ${{ inputs.chain_file }}
        run: |
          set -euo pipefail
          if [ -f shared/src/commonMain/kotlin/com/music/bitchord/data/settings/AutomixMixStyle.kt ]; then
            echo "Repo đã chứa sẵn các tính năng all-in-one, bỏ qua bước dựng lại."
            exit 0
          fi
          cat > "$RUNNER_TEMP/replay.py" <<'REPLAY_EOF'
          import os, re, subprocess, sys
          
          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "--break-system-packages", "pyyaml"])
              import yaml
          
          name = os.environ["CHAIN_FILE"]
          path = os.path.join(".github", "workflows", name)
          if not os.path.isfile(path):
              sys.exit(f"::error::Không thấy .github/workflows/{name}. Workflow này cần file đó để dựng lại các tính năng Automix (hoặc để input chain_file đúng tên).")
          
          doc = yaml.safe_load(open(path, encoding="utf8"))
          steps = next(iter(doc["jobs"].values()))["steps"]
          first = next((i for i, s in enumerate(steps) if s.get("name") == "Apply the combined changes"), None)
          last = next((i for i, s in enumerate(steps) if str(s.get("uses", "")).startswith("actions/setup-java")), None)
          if first is None or last is None or last <= first:
              sys.exit(f"::error::{name} không có cấu trúc như mong đợi (bước 'Apply the combined changes' ... 'Set up JDK'). Gửi lại file đó để mình chỉnh.")
          
          todo = [s for s in steps[first:last] if s.get("run")]
          print(f"Dựng lại {len(todo)} bước từ {name}")
          for s in todo:
              run = s["run"]
              # Mọi công tắc của workflow gốc chạy ở giá trị mặc định (tất cả bật).
              run = re.sub(r"\$\{\{\s*inputs\.\w+(\s*&&\s*inputs\.\w+)*\s*\}\}", "true", run)
              if "$" + "{{" in run:
                  sys.exit(f"::error::Bước '{s.get('name')}' còn biểu thức GitHub chưa xử lý được.")
              print(f"::group::{s.get('name')}", flush=True)
              r = subprocess.run(["bash", "-eo", "pipefail", "-c", run])
              print("::endgroup::", flush=True)
              if r.returncode != 0:
                  sys.exit(f"::error::Bước '{s.get('name')}' của {name} lỗi (mã {r.returncode}).")
          print("Đã dựng xong bản all-in-one.")
          REPLAY_EOF
          python3 "$RUNNER_TEMP/replay.py"

      - name: Write the patches
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/1-verdict-line.patch" <<'PATCH_EOF'
          diff --git a/app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt b/app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt
          index 46e620e..70e460c 100644
