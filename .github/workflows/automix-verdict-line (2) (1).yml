          +package com.music.bitchord.data.settings
          +
          +/**
          + * What Automix will do (or why it won't loop) at the next song change, in a
          + * form the player can word for a listener: a [kind] the UI turns into a
          + * sentence, and [seconds] for the kinds that count down.
          + *
          + * Published by the crossfade controller only once the change is close, so
          + * the line never sits on the player for a whole song.
          + */
          +data class AutomixVerdict(val kind: Kind, val seconds: Int = 0) {
          +    enum class Kind {
          +        /** A loop mix is planned (or its decks are being built): [seconds] until it starts. */
          +        LOOP_IN,
          +
          +        /** The loop mix is playing. */
          +        LOOPING,
          +
          +        /** Waiting for either song's analysis. */
          +        ANALYSING,
          +
          +        /** Waiting for synced lyrics, which say where the voices are. */
          +        WAITING_LYRICS,
          +
          +        /** No bar at the end of this song is free of singing. */
          +        NO_INSTRUMENTAL_OUT,
          +
          +        /** No bar at the start of the next song is free of singing. */
          +        NO_INSTRUMENTAL_IN,
          +
          +        /** One of the songs has no usable beat grid there. */
          +        NO_GRID,
          +
          +        /** A music video: its audio rarely matches what its lyrics are timed to. */
          +        VIDEO,
          +
          +        /** The native renderer didn't load on this device. */
          +        UNAVAILABLE,
          +
          +        /** Playback speed is not 1x. */
          +        SPEED,
          +
          +        /** Skip silence is on. */
          +        SKIP_SILENCE,
          +
          +        /** The sleep timer stops after this song. */
          +        SLEEP_TIMER,
          +
          +        /** The analysis was read off another recording than the one that plays. */
          +        SOURCE,
          +
          +        /** This audio output can't take the loop mix. */
          +        OUTPUT,
          +
          +        /** A loop mix was planned but couldn't start; the pair takes a normal blend. */
          +        FELL_BACK,
          +
          +        /** Anything else. */
          +        UNKNOWN,
          +    }
          +}
