name: Automix v3 - loop mix tuỳ chỉnh độ rộng (release-like APK)

# Chạy tay: tab Actions -> chọn workflow này -> Run workflow.
# Gồm tất cả của "Automix v2 - không đường cong âm lượng" (đã ghép đúng main hiện tại, sửa lỗi
# Switch/ModalBottomSheet), CỘNG thêm: Cài đặt -> Automix -> "Độ rộng của loop mix" (Chặt / Rộng / Thoáng).
#   Chặt   = như cũ (mặc định, không đổi hành vi).
#   Rộng   = tìm đoạn loop không lời xa hơn trong mỗi bài (trong phạm vi app đã phân tích).
#   Thoáng = như Rộng, nhưng bỏ qua lời bài và cho phép chút giọng hát trong loop -> nhiều cặp bài được loop mix hơn.
# Đừng chạy chung với các workflow automix-* khác: bản này đã chứa sẵn.
# Chép vào bản sao tạm của repo trên máy chủ, KHÔNG commit gì vào repo của bạn.
# Build "benchmark": R8 + baseline profile, ký bằng khoá debug, gói riêng com.dev.bitchord.benchmark.
# Nếu build lỗi: tải artifact "build-log" (chỉ có khi lỗi) rồi gửi lại để sửa.

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Chạy test của module shared trước khi build (lâu hơn, nhưng kiểm tra được code mới)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Apply the combined changes
        run: |
          echo "" | base64 -d | tar -xz
          patch -p1 --no-backup-if-mismatch < automix-dj-base.patch
          rm automix-dj-base.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: Shared tests
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest 2>&1 | tee build.log

      - name: Build the release-like dev APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDevBenchmark 2>&1 | tee -a build.log

      - name: List the APKs
        run: ls -la app/build/outputs/apk/dev/benchmark/

      - name: Upload the arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-benchmark-arm64
          path: app/build/outputs/apk/dev/benchmark/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload the build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
