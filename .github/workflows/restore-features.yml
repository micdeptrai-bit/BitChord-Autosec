name: Khôi phục Automix v6 + màn hình khóa vào repo (tự dò commit nền)

# CÁCH DÙNG
#   1. Chép file này vào .github/workflows/restore-features.yml trên GitHub rồi commit.
#   2. Tab Actions -> chọn "Khôi phục Automix v6 + màn hình khóa vào repo" -> Run workflow.
#
# LÀM GÌ
#   Chứa sẵn đúng chuỗi patch đã build ra APK đầy đủ của bạn (automix-v6-visualizer):
#   automix-dj-base.patch (Automix v2-v6, Mix style, bảng Mix, BPM/key, Spotify Canvas,
#   hiệu ứng thanh tua/âm lượng) rồi lockscreen.patch (trình phát màn hình khóa).
#   Các patch này viết trên main ngày 3/11, nên workflow tự dò lịch sử tìm commit gần nhất
#   mà cả hai patch áp SẠCH, áp vào, rồi gộp main hiện tại vào.
#   Khác các workflow automix-* cũ: bản này COMMIT thật lên nhánh restore/automix-v6-lockscreen
#   (không đụng main trừ khi bạn tick push_to_main).
#
# KẾT QUẢ (xem phần Summary của lần chạy)
#   - ok + merged=yes : nhánh sẵn sàng, build APK xong. Mở nhánh, tạo Pull Request vào main
#                       (hoặc chạy lại với push_to_main để đẩy thẳng).
#   - ok + merged=no  : patch áp đủ lên commit cũ nhưng gộp với main bị xung đột; log ghi rõ file nào.
#   - partial         : không commit nào áp sạch; nhánh ...-partial + artifact restore-rejects
#                       chứa các hunk lỗi. Gửi artifact đó lại để ghép nốt.
#
# LƯU Ý
#   - Nếu push bị từ chối vì "workflow" permission, tạo secret RESTORE_TOKEN (PAT có quyền
#     repo + workflow); workflow tự dùng nó.
#   - Đừng chạy chung với workflow automix-* / lockscreen-* khác: bản này đã chứa sẵn.

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "(Tuỳ chọn) SHA commit nền cũ nếu bạn biết; để trống để tự dò"
        type: string
        default: ""
      max_candidates:
        description: "Số commit tối đa để dò ngược lịch sử"
        type: string
        default: "300"
      build_apk:
        description: "Build APK để kiểm tra bản khôi phục compile được"
        type: boolean
        default: true
      run_tests:
        description: "Chạy thêm test module shared (lâu hơn)"
        type: boolean
        default: false
      push_to_main:
        description: "Đẩy thẳng kết quả vào nhánh đang chạy (main) nếu gộp sạch và build xong"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BRANCH: restore/automix-v6-lockscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RESTORE_TOKEN || github.token }}

      - name: Write the patches
