      - name: Find the base commit, apply, merge
        id: restore
        shell: bash
        env:
          INPUT_BASE: ${{ inputs.base_sha }}
          MAX_CANDIDATES: ${{ inputs.max_candidates }}
        run: |
          #!/usr/bin/env bash
          # Tìm commit nền mà các patch của bạn áp sạch, áp vào, gộp lại với main, ghi kết quả ra GITHUB_OUTPUT.
          set -uo pipefail

          TARGET_BRANCH="${TARGET_BRANCH:-restore/automix-v6-lockscreen}"
          MAX="${MAX_CANDIDATES:-300}"
          LOCK_FILE="${LOCK_FILE:-app/src/main/java/com/music/bitchord/lockscreen/LockScreenActivity.kt}"
          MIX_FILE="${MIX_FILE:-shared/src/commonMain/kotlin/com/music/bitchord/data/settings/AutomixMixStyle.kt}"
          P1="$RUNNER_TEMP/dj-base.patch"
          P2="$RUNNER_TEMP/lockscreen.patch"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          OUT="${GITHUB_OUTPUT:-/dev/null}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin '+refs/pull/*/head:refs/remotes/pr/*' >/dev/null 2>&1 || true

          ORIG=$(git rev-parse HEAD)

          say() { echo "$*" | tee -a "$SUMMARY"; }

          # Áp cả hai patch theo đúng thứ tự của workflow cũ. Thành công (exit 0) chỉ khi MỌI hunk đều áp được.
          apply_quiet() {
            patch -p1 -f -s --no-backup-if-mismatch < "$P1" >/dev/null 2>&1 || return 1
            patch -p1 -f -s --no-backup-if-mismatch < "$P2" >/dev/null 2>&1 || return 1
          }
          reset_tree() { git reset -q --hard; git clean -fdq; }
          try_base() {
            git checkout -qf "$1" 2>/dev/null || return 1
            reset_tree
            if apply_quiet; then reset_tree; return 0; fi
            reset_tree; return 1
          }

          # 0) Repo đã có sẵn tính năng rồi thì thôi.
          if [ -f "$LOCK_FILE" ] && [ -f "$MIX_FILE" ]; then
            say "### Repo này đã có màn hình khóa và Mix style rồi, không cần khôi phục."
            echo "status=already" >> "$OUT"; echo "merged=no" >> "$OUT"; exit 0
          fi

          # 1) Danh sách commit ứng viên: chỉ những commit từng đụng vào các file mà patch sửa.
          FILES=$( { grep -hE '^\+\+\+ ' "$P1" "$P2" | sed -E 's/^\+\+\+ [^/]+\///; s/[[:space:]].*$//'; } | sort -u )
          mapfile -t CANDS < <(git log --all --format=%H -n "$MAX" -- $FILES)

          if [ -n "${INPUT_BASE:-}" ]; then
            CHECK=("$(git rev-parse "$INPUT_BASE")")
          else
            CHECK=("$ORIG" "${CANDS[@]}")
          fi

          BASE=""; N=0
          for c in "${CHECK[@]}"; do
            N=$((N+1))
            if try_base "$c"; then BASE="$c"; break; fi
          done
          echo "Đã thử $N commit." 

          if [ -n "$BASE" ]; then
            # 2a) Tìm được commit nền: áp thật, commit, rồi gộp main hiện tại vào.
            git checkout -qf -B "$TARGET_BRANCH" "$BASE"
            reset_tree
            apply_quiet || { say "Lỗi lạ: áp patch lần hai thất bại."; echo "status=failed" >> "$OUT"; echo "merged=no" >> "$OUT"; exit 1; }
            git add -A
            git commit -q -m "Khôi phục Automix v6, màn hình khóa, Mix style và hiệu ứng thanh tua/âm lượng"
            MERGED=yes
            if [ "$BASE" != "$ORIG" ]; then
              if git merge --no-edit -m "Gộp main hiện tại vào bản khôi phục" "$ORIG" > merge.log 2>&1; then
                MERGED=yes
              else
                CONFLICTS=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
                git merge --abort
                MERGED=no
              fi
            fi
            say "### Tìm được commit nền: \`${BASE:0:10}\` (đã thử $N commit)"
            if [ "$MERGED" = yes ]; then
              say "Đã áp đủ patch và gộp sạch với main hiện tại. Nhánh: \`$TARGET_BRANCH\`."
            else
              say "Đã áp đủ patch lên commit cũ, nhưng gộp với main hiện tại bị xung đột ở:"
              say "$CONFLICTS"
              say "Nhánh \`$TARGET_BRANCH\` đang ở trạng thái commit cũ + tính năng (chưa có thay đổi mới của main). Gửi log này để ghép nốt."
            fi
            echo "status=ok" >> "$OUT"; echo "merged=$MERGED" >> "$OUT"; echo "base=$BASE" >> "$OUT"
            exit 0
          fi

          # 2b) Không commit nào áp sạch: áp lên main hiện tại, những hunk lỗi lưu vào restore-rejects/.
          git checkout -qf -B "$TARGET_BRANCH-partial" "$ORIG"
          reset_tree
          for P in "$P1" "$P2"; do patch -p1 -f -F3 --no-backup-if-mismatch < "$P" > "patch-$(basename "$P").log" 2>&1 || true; done
          mkdir -p restore-rejects
          find . -name '*.rej' -not -path './.git/*' -not -path './restore-rejects/*' | while read -r r; do
            mkdir -p "restore-rejects/$(dirname "$r")"; mv "$r" "restore-rejects/$r"
          done
          git add -A
          git commit -q -m "Khôi phục một phần: áp được lên main hiện tại, các hunk lỗi nằm trong restore-rejects/"
          REJ=$(find restore-rejects -name '*.rej' | wc -l)
          say "### Không có commit nào áp sạch cả hai patch (đã thử $N commit)"
          say "Đã áp một phần lên main hiện tại ($REJ file bị lỗi hunk, lưu trong \`restore-rejects/\`)."
          say "Code ở nhánh \`$TARGET_BRANCH-partial\` có thể chưa build được. Tải artifact \`restore-rejects\` gửi lại để ghép nốt."
          echo "status=partial" >> "$OUT"; echo "merged=no" >> "$OUT"
          exit 0

      - name: Push the restored branch
        if: ${{ steps.restore.outputs.status == 'ok' || steps.restore.outputs.status == 'partial' }}
        shell: bash
        run: |
          if [ "${{ steps.restore.outputs.status }}" = "ok" ]; then B="$TARGET_BRANCH"; else B="$TARGET_BRANCH-partial"; fi
          git push --force origin "HEAD:refs/heads/$B"
          echo "Đã đẩy nhánh $B" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the rejected hunks
        if: ${{ steps.restore.outputs.status == 'partial' }}
        uses: actions/upload-artifact@v4
        with:
          name: restore-rejects
          path: |
            restore-rejects/
            patch-*.log
          if-no-files-found: warn

      - name: Set up JDK 17
        if: ${{ steps.restore.outputs.status == 'ok' && inputs.build_apk }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ steps.restore.outputs.status == 'ok' && inputs.build_apk }}

      - name: Write local.properties
        if: ${{ steps.restore.outputs.status == 'ok' && inputs.build_apk }}
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties
          chmod +x gradlew

      - name: Shared tests
        if: ${{ steps.restore.outputs.status == 'ok' && inputs.build_apk && inputs.run_tests }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest 2>&1 | tee build.log

      - name: Build the release-like dev APK
        if: ${{ steps.restore.outputs.status == 'ok' && inputs.build_apk }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDevBenchmark 2>&1 | tee -a build.log
          ls -la app/build/outputs/apk/dev/benchmark/

      - name: Upload the arm64 APK
        if: ${{ steps.restore.outputs.status == 'ok' && inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-benchmark-arm64
          path: app/build/outputs/apk/dev/benchmark/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload the build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Push straight to the running branch
        if: ${{ inputs.push_to_main && steps.restore.outputs.status == 'ok' && steps.restore.outputs.merged == 'yes' }}
        shell: bash
        run: |
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "Đã đẩy thẳng vào ${GITHUB_REF_NAME}" | tee -a "$GITHUB_STEP_SUMMARY"
