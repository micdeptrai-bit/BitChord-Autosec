          +    fun whenThereAreNotEnoughNewSongsFamiliarOnesFillIn() {
          +        val familiarIds = (1..8).map { "f$it" }
          +        val taste = AiMixTaste(songPlays = familiarIds.associateWith { 3 })
          +        val candidates = familiarIds.mapIndexed { i, id -> cand(id, "Known $i") } +
          +            (1..2).map { cand("n$it", "New $it") }
          +        val mix = build(candidates, taste = taste, size = 6, freshShare = 0.6)
          +        assertEquals(6, mix.size)
          +    }
