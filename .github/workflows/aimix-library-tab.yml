          +                AiMixEngine.artistKey("Rock One") to setOf("rock"),
          +                AiMixEngine.artistKey("Rock Two") to setOf("rock"),
          +                AiMixEngine.artistKey("Rock Three") to setOf("rock"),
          +            ),
          +        )
          +        val candidates = listOf(
          +            cand("r1", "Rock One"), cand("r2", "Rock Two"), cand("r3", "Rock Three"),
