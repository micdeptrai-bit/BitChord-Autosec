          +        features = features,
          +        random = Random(42),
          +    )
          +
          +    @Test
          +    fun emptyCandidatesGiveAnEmptyMix() {
          +        assertTrue(build(emptyList()).isEmpty())
          +    }
          +
          +    @Test
          +    fun theMixNeverExceedsTheRequestedSize() {
          +        val candidates = (1..40).map { cand("v$it", "artist $it") }
          +        assertEquals(10, build(candidates, size = 10).size)
          +    }
          +
          +    @Test
          +    fun theSameSongIsNotQueuedTwice() {
          +        val candidates = listOf(
          +            // Same video id.
          +            AiMixCandidate(song("a", "X", title = "One"), AiMixOrigin.HABIT_RADIO),
          +            AiMixCandidate(song("a", "X", title = "Other"), AiMixOrigin.HABIT_RADIO),
          +            // Different id, same title and artist: a re-upload.
          +            AiMixCandidate(song("b", "X", title = "One"), AiMixOrigin.GENRE_SEARCH),
          +        )
          +        assertEquals(1, build(candidates).size)
          +    }
          +
          +    @Test
          +    fun anArtistGetsAtMostTwoSlots() {
          +        val candidates = (1..6).map { cand("a$it", "Artist A") } +
          +            (1..2).map { cand("b$it", "Artist B") }
          +        val mix = build(candidates, size = 10)
          +        assertEquals(2, mix.count { it.artist == "Artist A" })
          +        assertEquals(4, mix.size)
          +    }
          +
          +    @Test
          +    fun sameArtistIsNotPlayedBackToBackWhenItCanBeAvoided() {
          +        val candidates = listOf(
          +            cand("a1", "A"), cand("a2", "A"),
          +            cand("b1", "B"), cand("b2", "B"),
          +            cand("c1", "C"), cand("c2", "C"),
          +        )
          +        val mix = build(candidates, size = 6)
          +        assertEquals(6, mix.size)
          +        for (i in 1 until mix.size) {
          +            assertNotEquals(mix[i - 1].artist, mix[i].artist, "positions ${i - 1} and $i")
          +        }
          +    }
          +
          +    @Test
          +    fun aGenreMixPrefersArtistsKnownForThatGenre() {
          +        val taste = AiMixTaste(
