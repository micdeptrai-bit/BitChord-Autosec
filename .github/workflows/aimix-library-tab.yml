          +package com.music.bitchord.data.aimix
          +
          +import android.content.Context
          +
          +/**
          + * The AI Mix on/off switch. Stored in the app's own settings file under its own
          + * key, so it cannot touch any other setting.
          + */
          +object AiMixPrefs {
          +
          +    private const val FILE = "bitchord_settings"
          +    private const val KEY = "ai_mix_enabled"
          +
          +    /** On by default, so the section shows up the first time the app is opened. */
          +    fun isEnabled(context: Context): Boolean =
          +        context.getSharedPreferences(FILE, Context.MODE_PRIVATE).getBoolean(KEY, true)
          +
          +    fun setEnabled(context: Context, enabled: Boolean) {
          +        context.getSharedPreferences(FILE, Context.MODE_PRIVATE)
          +            .edit()
          +            .putBoolean(KEY, enabled)
          +            .apply()
          +    }
          +}
