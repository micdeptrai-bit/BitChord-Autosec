          +/**
          + * The sheet behind the AI Mix tab, beside Library: the on/off switch, then the
          + * same mode picker the Home section uses. Starting a mix closes the sheet.
          + */
          +@OptIn(ExperimentalMaterial3Api::class)
          +@Composable
          +fun AiMixSheet(
          +    enabled: Boolean,
          +    onEnabledChange: (Boolean) -> Unit,
          +    busy: Boolean,
          +    failed: Boolean,
          +    onStart: (AiMixMode) -> Unit,
          +    onDismiss: () -> Unit,
          +) {
          +    ModalBottomSheet(onDismissRequest = onDismiss) {
          +        Column(
          +            modifier = Modifier
          +                .fillMaxWidth()
          +                .padding(start = 20.dp, end = 20.dp, bottom = 24.dp),
          +        ) {
          +            Row(
          +                modifier = Modifier.fillMaxWidth(),
          +                verticalAlignment = Alignment.CenterVertically,
          +            ) {
          +                Text(
          +                    text = stringResource(R.string.ai_mix_enable),
          +                    style = MaterialTheme.typography.titleMedium,
          +                    modifier = Modifier.weight(1f),
          +                )
          +                Switch(checked = enabled, onCheckedChange = onEnabledChange)
          +            }
          +            Spacer(Modifier.height(12.dp))
          +            AiMixSection(busy = busy, failed = failed, onStart = onStart)
          +        }
          +    }
          +}
