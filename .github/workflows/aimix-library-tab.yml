          +        assertEquals(0.0, AiMixEngine.transitionCost(base, base))
          +        assertTrue(
          +            AiMixEngine.transitionCost(base, AiMixFeatures(120.0, "9A")) <
          +                AiMixEngine.transitionCost(base, AiMixFeatures(120.0, "3B")),
          +        )
          +    }
          +
          +    @Test
          +    fun analyzerKeyNamesAreUnderstood() {
          +        // A minor and C major are relative keys: the same slot on the wheel.
          +        val minor = AiMixFeatures(120.0, "A minor")
          +        val relativeMajor = AiMixFeatures(120.0, "C major")
          +        assertEquals(0.1, AiMixEngine.transitionCost(minor, relativeMajor))
          +        // And the same song's key written both ways is the same key.
          +        assertEquals(
