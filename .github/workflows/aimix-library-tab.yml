          +        )
          +    }
          +
          +    @Test
          +    fun anUnreadableKeyIsNeutralNotAnError() {
          +        val known = AiMixFeatures(120.0, "8A")
          +        val unknown = AiMixFeatures(120.0, "")
          +        assertEquals(0.3, AiMixEngine.transitionCost(known, unknown))
          +    }
          +
          +    @Test
          +    fun halfTimeCountsAsTheSamePulse() {
          +        assertEquals(
          +            0.0,
          +            AiMixEngine.transitionCost(AiMixFeatures(120.0, "8A"), AiMixFeatures(60.0, "8A")),
          +        )
          +    }
          +
          +    @Test
          +    fun unknownSoundIsNeutral() {
          +        assertEquals(0.5, AiMixEngine.transitionCost(null, AiMixFeatures(120.0, "8A")))
          +        assertEquals(0.5, AiMixEngine.transitionCost(AiMixFeatures(120.0, "8A"), null))
          +    }
          +
          +    @Test
          +    fun surpriseNeverRepeatsTheExcludedGenre() {
          +        val random = Random(1)
          +        repeat(60) {
          +            assertNotEquals("jazz", AiMixGenres.pickSurprise(random, except = "jazz").id)
          +        }
          +    }
          +
          +    @Test
          +    fun genreSpellingsAreNormalised() {
          +        assertEquals("hiphop", AiMixGenres.keyOf("Hip Hop"))
          +        assertEquals("rnb", AiMixGenres.keyOf("R&B"))
          +        assertEquals("kpop", AiMixGenres.keyOf("K Pop"))
          +        assertEquals("lofi", AiMixGenres.keyOf("Lo-Fi"))
          +    }
          +
