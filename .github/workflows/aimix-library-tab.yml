          +            }
          +            item(key = "ai-mix-surprise") {
          +                MixChip(
          +                    label = stringResource(Res.string.ai_mix_surprise),
          +                    selected = selected is AiMixMode.Surprise,
          +                    onClick = { selected = AiMixMode.Surprise },
          +                )
          +            }
          +            items(AiMixGenres.ALL, key = { "ai-mix-genre-${it.id}" }) { genre ->
          +                MixChip(
          +                    label = genre.label,
