          diff -ruN a/app/src/main/res/values-vi/strings.xml b/app/src/main/res/values-vi/strings.xml
          --- a/app/src/main/res/values-vi/strings.xml	2026-10-30 14:18:31.183723031 +0000
          +++ b/app/src/main/res/values-vi/strings.xml	2026-10-30 14:18:43.272304394 +0000
          @@ -1288,4 +1288,6 @@
               <string name="song_info_unavailable">Không có thông tin</string>
               <string name="song_info_error">Không thể tải một số thông tin.</string>
               <string name="song_info_retry">Thử lại</string>
          +    <string name="ai_mix_tab">AI Mix</string>
          +    <string name="ai_mix_enable">Bật AI Mix</string>
           </resources>
          AIMIX_PATCH_EOF
          if [ -f app/src/main/java/com/music/bitchord/ui/aimix/AiMixSheet.kt ]; then
            echo "AI Mix tab is already in this tree, so the AI Mix tab patch step is skipped."
          else
            if ! patch -p1 --dry-run -s < "$PATCH" > /tmp/aimix-library-tab.check 2>&1; then
              cat /tmp/aimix-library-tab.check
              echo "::error::AI Mix tab patch does not apply to this tree. Nothing was changed."
              exit 1
            fi
            patch -p1 -s < "$PATCH"
            echo "AI Mix tab patch applied."
          fi
          rm -f "$PATCH"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: AI Mix tests (non-blocking; report uploaded on failure)
        continue-on-error: true
        run: ./gradlew :shared:jvmTest --tests "*AiMix*"

      - name: Build the dev APK
        run: ./gradlew assembleDevDebug

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-debug-aimix-library-tab
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: shared/build/reports/tests/
