          +                    onClick = { selected = AiMixMode.Genre(genre.id) },
          +                )
          +            }
          +        }
          +
          +        val description = when (val mode = selected) {
          +            is AiMixMode.ForYou -> stringResource(Res.string.ai_mix_desc_for_you)
          +            is AiMixMode.Surprise -> stringResource(Res.string.ai_mix_desc_surprise)
          +            is AiMixMode.Genre -> stringResource(
