name: Automix + màn hình khóa cho bản 1.9 (release-like APK)

# Chạy tay: tab Actions -> chọn workflow này -> Run workflow.
# Dành cho code 1.9 hiện tại của fork: đã chuyển Automix (nút Mix, BPM/key, kiểu mix,
# đường cong âm lượng, công tắc Spotify Canvas) và Trình phát màn hình khóa sang đúng
# cấu trúc của 1.9. Thay thế các workflow automix-* cũ (chúng viết cho 1.8.1, không chạy được trên 1.9).
# Chép vào bản sao tạm của repo trên máy chủ, KHÔNG commit gì vào repo của bạn.
# Build "benchmark": R8, ký bằng khoá debug, gói riêng com.dev.bitchord.benchmark2, chỉ arm64.
# Nếu build lỗi: tải artifact "build-log" (chỉ có khi lỗi) rồi gửi lại để sửa.

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Chạy test module shared trước khi build (lâu hơn)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

