name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Secrets go through env: rather than being pasted into the script text, so
    # a password containing " $ ` or \ cannot break (or inject into) the shell.
    #
    # The keystore is only written once every signing secret is present. An
    # empty bitchord-release.jks is worse than none: app/ and wearos/
    # build.gradle.kts fall back to an *unsigned* APK when the file is absent,
    # but an empty file passes their exists() check and then fails the build at
    # packageProdRelease ("Tag number over 30 is not supported").
    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [ -z "${!v}" ]; then
            echo "::error::Secret $v is empty. Add it under Settings > Secrets and variables > Actions (repository secret, or set 'environment:' on this job if it is an environment secret)."
            exit 1
          fi
        done

        {
          echo "LASTFM_API_KEY=$LASTFM_API_KEY"
          echo "LASTFM_SECRET=$LASTFM_SECRET"
          echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER"
        } > local.properties

        echo "$KEYSTORE_BASE64" | base64 -d > bitchord-release.jks

        # Fail here, in seconds, if the keystore / password / alias do not match
        # rather than after the ~8 minute compile.
        if ! keytool -list -keystore bitchord-release.jks \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
          echo "::error::Cannot open keystore: KEYSTORE_BASE64 is not valid base64 of the .jks, or KEYSTORE_PASSWORD / KEY_ALIAS is wrong."
          exit 1
        fi

        {
          echo "storeFile=bitchord-release.jks"
          echo "storePassword=$KEYSTORE_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASSWORD"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk
        if-no-files-found: error

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
        if-no-files-found: error

    - name: Remove signing material
      if: always()
      run: rm -f bitchord-release.jks keystore.properties local.properties
