      # Patch dùng Switch / SwitchDefaults / ModalBottomSheet trong SettingsSheet.kt
      # nhưng không thêm import -> "Unresolved reference" (app + tv đều lỗi).
      # Bước này tự bổ sung import + opt-in nếu file còn thiếu.
      - name: Fix missing Material3 imports in SettingsSheet.kt
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt")
          s = p.read_text(encoding="utf-8")
          need = [
              "androidx.compose.material3.ExperimentalMaterial3Api",
              "androidx.compose.material3.ModalBottomSheet",
              "androidx.compose.material3.Switch",
              "androidx.compose.material3.SwitchDefaults",
          ]
          if "import androidx.compose.material3.*" in s:
              missing = []
          else:
              missing = [n for n in need if not re.search(r"^import " + re.escape(n) + r"\s*$", s, re.M)]
          if missing:
              lines = s.split("\n")
              last = max(i for i, l in enumerate(lines) if l.startswith("import "))
              lines[last + 1:last + 1] = ["import " + n for n in missing]
              s = "\n".join(lines)
          # ModalBottomSheet can be @ExperimentalMaterial3Api on older material3 versions
          if "ExperimentalMaterial3Api::class" not in s:
              if re.search(r"^@file:OptIn\(", s, re.M):
                  s = re.sub(r"^@file:OptIn\(", "@file:OptIn(ExperimentalMaterial3Api::class, ", s, count=1, flags=re.M)
              else:
                  s = re.sub(r"^package ", "@file:OptIn(ExperimentalMaterial3Api::class)\n\npackage ", s, count=1, flags=re.M)
          p.write_text(s, encoding="utf-8")
          print("Added imports:", missing or "none (already present)")
          for n in need:
              if "import androidx.compose.material3.*" not in s and ("import " + n) not in s:
                  sys.exit("Still missing import: " + n)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: Shared tests
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest 2>&1 | tee build.log

      - name: Build the release-like dev APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDevBenchmark 2>&1 | tee -a build.log

      - name: List the APKs
        run: ls -la app/build/outputs/apk/dev/benchmark/

      - name: Upload the arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-benchmark-arm64
          path: app/build/outputs/apk/dev/benchmark/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload the build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
