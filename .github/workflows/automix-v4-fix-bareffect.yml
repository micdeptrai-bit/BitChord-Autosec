name: Automix v4 + màn hình khóa - bản sửa lỗi build (BarEffect public)

# SỬA: ThinSlider (public) dùng kiểu BarEffect (internal) làm build :sharedUi lỗi -> BarEffect nay là public.
# Chạy tay: tab Actions -> chọn workflow này -> Run workflow.
# Gồm tất cả của v3 (đã gồm v2: không đường cong âm lượng, ghép đúng main hiện tại), CỘNG thêm:
#   Cài đặt -> Automix -> "Phân tích sâu" (công tắc, mặc định TẮT).
#   Bật: mỗi bài được phân tích 3 cửa sổ đầu + 5 cửa sổ cuối (thay vì 2 + 3), tức ~90 giây đầu và ~150 giây cuối.
#   Loop mix mức "Rộng"/"Thoáng" nhờ đó có vùng tìm rộng hơn (tối đa 140 giây cuối bài cũ, 80 giây đầu bài mới).
#   Tốn CPU/pin hơn lúc phân tích. Kết quả lưu ở thư mục riêng (deep-analysis) nên không lẫn với kết quả cũ.
#   Áp dụng từ lần mở lại app sau khi đổi công tắc (bài đã phân tích trong phiên hiện tại giữ nguyên).
# CỘNG thêm màn hình khóa (lấy từ bản 1.9, ghép lại cho khớp v4):
#   Cài đặt -> "Màn hình khóa" (công tắc BETA, mặc định TẮT) -> cấp quyền "Hiển thị trên các ứng dụng khác".
#   Khi nhạc đang phát và bạn bật màn hình, player toàn màn hình (bìa/Canvas, đồng hồ, điều khiển) hiện trên màn hình khóa.
# Đừng chạy chung với các workflow automix-* khác: bản này đã chứa sẵn.
# Chép vào bản sao tạm của repo trên máy chủ, KHÔNG commit gì vào repo của bạn.
# Build "benchmark": R8 + baseline profile, ký bằng khoá debug, gói riêng com.dev.bitchord.benchmark.
# Nếu build lỗi: tải artifact "build-log" (chỉ có khi lỗi) rồi gửi lại để sửa.

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Chạy test của module shared trước khi build (lâu hơn, nhưng kiểm tra được code mới)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Apply the combined changes
        run: |
          echo "" | base64 -d | tar -xz
          patch -p1 --no-backup-if-mismatch < automix-dj-base.patch
          rm automix-dj-base.patch

