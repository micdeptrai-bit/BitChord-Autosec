name: Màn hình khóa Liquid Glass (release-like APK)

# Chạy tay: tab Actions -> chọn workflow này -> Run workflow.
# Chỉ thêm "Trình phát màn hình khóa" (Liquid Glass bản mới) lên nhánh main HIỆN TẠI.
# Không phụ thuộc các patch automix/stage1 cũ (chúng không còn áp sạch lên main nữa).
# Chép vào bản sao tạm trên máy chủ, KHÔNG commit gì vào repo, nên main vẫn nguyên vẹn.
# Build "benchmark": R8 + baseline profile, ký bằng khoá debug.
# Sau khi cài: Cài đặt -> bật "Trình phát màn hình khóa" -> cấp "Hiển thị trên các ứng dụng khác".
# Mỗi gói cài đặt (applicationId) có cài đặt và quyền riêng, nên bản cài mới phải bật/cấp lại.
# Nếu build lỗi: tải artifact "build-log" (chỉ có khi lỗi) rồi gửi lại để sửa.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Apply the lock-screen player
        run: |
          echo "" | base64 -d | tar -xz
          patch -p1 --no-backup-if-mismatch < lockscreen-glass.patch
          rm lockscreen-glass.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: Build the release-like dev APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDevBenchmark 2>&1 | tee build.log

      - name: List the APKs
        run: ls -la app/build/outputs/apk/dev/benchmark/

      - name: Upload the arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-benchmark-arm64
          path: app/build/outputs/apk/dev/benchmark/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload the build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
