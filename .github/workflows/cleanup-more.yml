name: Dọn đợt 2 (xóa thêm workflow thừa, tự xóa chính nó)

# Cách dùng (làm trên điện thoại được):
#  1. Secret WORKFLOW_PAT phải có sẵn (token classic, tick "repo" và "workflow").
#     GITHUB_TOKEN mặc định không được phép sửa thư mục .github/workflows nên bắt buộc dùng token này.
#  2. Thêm file này vào .github/workflows/cleanup-more.yml
#  3. Actions -> "Dọn đợt 2" -> Run workflow:
#       dry_run = true  -> chỉ liệt kê, chưa xóa gì (mặc định, nên chạy lần này trước)
#       dry_run = false -> xóa thật rồi commit thẳng vào nhánh đang chạy
#
# Chỉ xóa đúng danh sách ghi cứng bên dưới. File BẮT BUỘC giữ (all-in-one (2) và automix-verdict-line)
# được kiểm tra trước, thiếu là dừng, không xóa gì. File lạ khác (vd cleanup-repo.yml) không bị đụng tới.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ liệt kê, chưa xóa (bỏ tick để xóa thật)"
        type: boolean
        default: true
      delete_restore:
        description: "Xóa luôn restore-features.yml (công cụ gộp tính năng vào main)"
        type: boolean
        default: true
      delete_upstream:
        description: "Xóa các workflow gốc của dự án (check, close-issue, deploy-backend, tv, web, contributors)"
        type: boolean
        default: true
      delete_self:
        description: "Xóa luôn file dọn dẹp này sau khi xong"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra token
        env:
          PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::Chưa có secret WORKFLOW_PAT (xem hướng dẫn đầu file)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Xóa workflow trùng và cũ
        shell: bash
        env:
          DRY: ${{ inputs.dry_run }}
          DEL_RESTORE: ${{ inputs.delete_restore }}
          DEL_UPSTREAM: ${{ inputs.delete_upstream }}
          DEL_SELF: ${{ inputs.delete_self }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd .github/workflows

          # File bắt buộc giữ: thiếu là dừng ngay. Workflow mới có thể tên
          # "automix-verdict-line.yml" hoặc "automix-verdict-line (1).yml"
          # (trình duyệt hay tự thêm "(1)" khi tải lại), chấp nhận cả hai.
          MUST_KEEP=(
            "automix-all-in-one (2).yml"
            "automix-verdict-line.yml"
            "automix-verdict-line (1).yml"
          )
          if [ ! -f "automix-all-in-one (2).yml" ]; then
            echo "::error::Thiếu file bắt buộc 'automix-all-in-one (2).yml'. Dừng, chưa xóa gì. Các file hiện có:"
            ls -1
            exit 1
          fi
          if [ ! -f "automix-verdict-line.yml" ] && [ ! -f "automix-verdict-line (1).yml" ]; then
            echo "::error::Không thấy workflow automix-verdict-line (cả hai tên). Dừng, chưa xóa gì. Các file hiện có:"
            ls -1
            exit 1
          fi

          # Luôn xóa: file dọn của đợt trước và file dọn lẻ, nếu còn sót.
          TO_DELETE=(
            "cleanup-old-workflows.yml"
            "cleanup-repo.yml"
            "cleanup-workflows (4).yml"
          )
          if [ "$DEL_RESTORE" = "true" ]; then
            TO_DELETE+=("restore-features.yml")
          fi
          # Workflow gốc của dự án (không liên quan tới build Automix của bạn).
          if [ "$DEL_UPSTREAM" = "true" ]; then
            TO_DELETE+=(
              "check.yml"
              "close-issue.yml"
              "deploy-backend.yml"
              "tv.yml"
              "web.yml"
              "contributors-image.yml"
              "update-contributors.yml"
            )
          fi

          # Chốt an toàn: không bao giờ xóa file bắt buộc giữ hoặc chính file này.
          SELF="cleanup-more.yml"
          for f in "${TO_DELETE[@]}"; do
            for k in "${MUST_KEEP[@]}" "$SELF"; do
              if [ "$f" = "$k" ]; then
                echo "::error::'$f' nằm trong danh sách xóa nhưng là file cần giữ. Dừng."
                exit 1
              fi
            done
          done

          removed=0
          for f in "${TO_DELETE[@]}"; do
            if [ -e "$f" ]; then
              echo "Xóa: $f"
              if [ "$DRY" != "true" ]; then git rm -q -- "$f"; fi
              removed=$((removed + 1))
            else
              echo "Bỏ qua (không có): $f"
            fi
          done
          echo "Tổng: $removed file."
          echo "Giữ nguyên các file còn lại:"
          ls -1 | sed 's/^/  /'

          if [ "$DRY" = "true" ]; then
            echo "Dry run: chưa xóa gì. Chạy lại với dry_run bỏ tick để xóa thật."
            exit 0
          fi

          if [ "$DEL_SELF" = "true" ] && [ -e "$SELF" ]; then
            git rm -q -f -- "$SELF"
          fi

          if git diff --cached --quiet; then
            echo "Không có gì để commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove duplicate and obsolete workflows"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "Đã xóa và commit vào ${TARGET_BRANCH}."
