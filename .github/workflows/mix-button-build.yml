name: Automix - Nut Mix tren trinh phat (build APK)

# Chay tay: tab Actions -> chon workflow nay -> Run workflow.
# Them nut Mix (icon lap lanh) vao nhom nut shuffle/repeat/autoplay cua trinh phat
# (mo hang doi de thay). Bam vao se mo popup chinh Automix ngay tai trinh phat:
#   - Bat/tat Automix
#   - Hieu nang phan tich: Tiet kiem / Can bang / Hieu nang
#   - Do dai crossfade 0-12s (khi Automix tat)
#   - Nut "Xem doan mix hien tai" khi dang co mot doan mix
# Workflow ghep ban va vao ban sao tam cua repo tren may chu roi build.
# Khong commit gi vao repo cua ban.
#
# Build "benchmark": co R8, khong debuggable, ky bang khoa debug, goi rieng
# com.dev.bitchord.benchmark2 nen cai song song voi ban dev/prod.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Loai build"
        type: choice
        options:
          - benchmark (nhanh, muot, giong ban phat hanh)
          - debug (build nhanh hon, chay cham hon)
        default: "benchmark (nhanh, muot, giong ban phat hanh)"
      run_tests:
        description: "Chay them test truoc khi build (lau hon)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Apply the Mix button patch
        run: |
          echo "" | base64 -d | gunzip > mix-button.patch
          patch -p1 --dry-run < mix-button.patch
          patch -p1 < mix-button.patch
          rm -f mix-button.patch *.orig *.rej

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: Shared tests
        if: ${{ inputs.run_tests }}
        run: ./gradlew :shared:jvmTest

      - name: Build the APK
        run: |
          if [[ "${{ inputs.build_type }}" == debug* ]]; then
            ./gradlew assembleDevDebug
          else
            ./gradlew assembleDevBenchmark
          fi

      - name: List the APKs
        run: find app/build/outputs/apk/dev -name "*.apk" -exec ls -la {} \;

      - name: Upload the arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-mix-button-arm64
          path: app/build/outputs/apk/dev/*/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload all APKs (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-mix-button-all
          path: app/build/outputs/apk/dev/*/*.apk
          if-no-files-found: error
