name: Automix day du - Nut Mix + Man hinh khoa Liquid Glass (build APK)

# Chay tay: tab Actions -> chon workflow nay -> Run workflow.
# Ban DAY DU, ghep len main hien tai (1.9), khong commit gi vao repo cua ban:
#   - Automix cua ban: nut Mix, BPM/key, kieu mix, duong cong am luong, cong tat Spotify Canvas
#   - Trinh phat man hinh khoa ban Liquid Glass (ban moi, thay ban cu trong 1.9)
#   - Popup Automix o nut Mix: bat/tat Automix, hieu nang phan tich (Tiet kiem / Can bang / Hieu nang),
#     do dai crossfade 0-12s khi Automix tat, "Xem doan mix hien tai", va dong cuoi mo lai
#     bang chinh do dai / kieu / duong cong mix nhu truoc.
# Dung chay chung voi cac workflow automix-* / lockscreen-* khac: ban nay da chua san.
# Build "benchmark": co R8, khong debuggable, ky bang khoa debug, goi rieng
# com.dev.bitchord.benchmark2 nen cai song song voi ban dev/prod.
# Da sua loi build: thieu import Switch/SwitchDefaults/ModalBottomSheet trong SettingsSheet.kt.
# Neu build loi: tai artifact "build-log" (chi co khi loi) roi gui lai de sua.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Loai build"
        type: choice
        options:
          - benchmark (nhanh, muot, giong ban phat hanh)
          - debug (build nhanh hon, chay cham hon)
        default: "benchmark (nhanh, muot, giong ban phat hanh)"
      run_tests:
        description: "Chay them test truoc khi build (lau hon)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

