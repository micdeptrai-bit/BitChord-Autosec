      # Ban patch goi Switch / SwitchDefaults / ModalBottomSheet cua Material3 trong
      # SettingsSheet.kt nhung file nay tren main (1.9) khong import 3 ham do
      # (main dung IosSwitch) -> "Unresolved reference" o ca :app va :tv.
      # Them import neu chua co (chay lai nhieu lan van an toan).
      - name: Fix missing Material3 imports in SettingsSheet
        run: |
          F=app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          test -f "$F"
          for sym in Switch SwitchDefaults ModalBottomSheet; do
            if ! grep -q "^import androidx.compose.material3.$sym$" "$F"; then
              sed -i "0,/^import androidx.compose.material3.Text$/s//import androidx.compose.material3.$sym\nimport androidx.compose.material3.Text/" "$F"
            fi
          done
          grep -n "^import androidx.compose.material3" "$F"
          for sym in Switch SwitchDefaults ModalBottomSheet; do
            grep -q "^import androidx.compose.material3.$sym$" "$F" || { echo "THIEU import $sym"; exit 1; }
          done

      # Test aForcedGestureReplacesThePerPairPick (nam trong patch) dung cap 120 -> 97 BPM,
      # nhung tren main 1.9 cua ban cap nay NAM TRONG khoang stretch (120/97 = 1.237 <= 1.25)
      # nen bi coi la beatmatch (DJ_BLEND) -> cu chi ep BASS_HANDOFF bi bo qua -> test fail.
      # Doi sang 94 BPM (ngoai khoang stretch, giong test aTempoOnlyMismatchIsStillFiltered),
      # cung tong C major, va cho 1 bai co bass / 1 bai khong de cu chi tu chon thay doi.
      - name: Fix forced-gesture planner test
        run: |
          T=shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/AdvancedAutomixPlannerTest.kt
          test -f "$T"
          sed -i 's|val current = track("stable-out", 120.0, "C major", vocal = 0.5)|val current = track("stable-out", 120.0, "C major", vocal = 0.1, bass = 1.0)|' "$T"
          sed -i 's|val next = track("incoming-$index", 97.0, "F♯ major", vocal = 0.5)|val next = track("incoming-$index", 94.0, "C major", vocal = 0.1, bass = if (index % 2 == 0) 1.0 else null)|' "$T"
          grep -n 'stable-out\|incoming-' "$T"
          grep -q 'incoming-$index", 94.0, "C major"' "$T" || { echo "SED KHONG KHOP (test)"; exit 1; }
          grep -q 'stable-out", 120.0, "C major", vocal = 0.1, bass = 1.0' "$T" || { echo "SED KHONG KHOP (current)"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: Shared tests
        if: ${{ inputs.run_tests }}
        run: ./gradlew :shared:jvmTest

      - name: Build the APK
        shell: bash
        run: |
          set -o pipefail
          if [[ "${{ inputs.build_type }}" == debug* ]]; then
            ./gradlew assembleDevDebug 2>&1 | tee build.log
          else
            ./gradlew assembleDevBenchmark 2>&1 | tee build.log
          fi

      - name: List the APKs
        run: find app/build/outputs/apk/dev -name "*.apk" -exec ls -la {} \;

      - name: Upload the arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-full-arm64
          path: app/build/outputs/apk/dev/*/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload all APKs (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-full-all
          path: app/build/outputs/apk/dev/*/*.apk
          if-no-files-found: error

      - name: Upload the build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
