name: Dev Benchmark APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleDevBenchmark

      - name: List APKs
        if: always()
        run: find . -name "*.apk" -not -path "*/node_modules/*"

      - uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-benchmark
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
