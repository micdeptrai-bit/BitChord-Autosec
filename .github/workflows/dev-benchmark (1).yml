name: Bit Dev APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BIT_DEV_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Cac tinh nang Automix / man hinh khoa / AI DJ KHONG nam trong main: chung nam trong
      # patch cua cac workflow automix-*. Buoc nay dung lai dung chuoi do truoc khi build.
      - name: Automix features (dung lai tu workflow automix-*)
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, subprocess, sys
          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "--break-system-packages", "pyyaml"])
              import yaml

          def title(p):
              for line in open(p, encoding="utf8", errors="replace"):
                  if line.startswith("name:"):
                      return line
              return ""

          wf = glob.glob(".github/workflows/*.yml")
          verdict = sorted(p for p in wf if "loop mix + gom" in title(p))
          chain = sorted(p for p in wf if os.path.basename(p).startswith("automix-all-in-one"))
          if not verdict or not chain:
              sys.exit("::error::Khong thay workflow automix-verdict-line / automix-all-in-one trong .github/workflows")
          chain = next((p for p in chain if "(2)" in p), chain[0])
          print("verdict:", verdict, "| chain:", chain)

          def load_steps(p):
              d = yaml.safe_load(open(p, encoding="utf8"))
              return {st.get("name"): st for st in next(iter(d["jobs"].values()))["steps"]}

          def run_step(st, env):
              print("::group::" + st["name"], flush=True)
              r = subprocess.run(["bash", "-eo", "pipefail", "-c", st["run"]], env=env)
              print("::endgroup::", flush=True)
              return r.returncode == 0

          env = dict(os.environ, CHAIN_FILE=os.path.basename(chain))
          # Ban "(2) (1)" la ban patch dung; cac ban khac thu sau neu ban do khong ap duoc.
          cands = sorted(verdict, key=lambda p: ("(2) (1)" not in p, p))
          if not run_step(load_steps(cands[0])["Rebuild the all-in-one features"], env):
              sys.exit("::error::Khong dung lai duoc chuoi all-in-one")
          git = ["git", "-c", "user.name=ci", "-c", "user.email=ci@example.com"]
          subprocess.run(["git", "add", "-A"], check=True)
          subprocess.run(git + ["commit", "-q", "--allow-empty", "-m", "base"], check=True)
          for v in cands:
              print("Thu:", v, flush=True)
              st = load_steps(v)
              if run_step(st["Write the patches"], env) and run_step(st["Apply the patches"], env):
                  print("OK:", v)
                  break
              subprocess.run(["git", "reset", "-q", "--hard", "HEAD"], check=True)
          else:
              sys.exit("::error::Khong ban patch automix-verdict-line nao ap duoc")
          PY

      # Doi ten + version ngay luc build, khong can sua file nao khac.
      - name: Patch (rename, version, updater)
        env:
          RUN: ${{ github.run_number }}
        run: |
          sed -i 's/com\.dev\.bitchord/com.bit.dev/g; s/BitChord Dev/Bit Dev/g' \
            app/build.gradle.kts app/src/dev/AndroidManifest.xml wearos/build.gradle.kts tv/build.gradle.kts
          sed -i '/UPDATE_APK_PREFIX/s/BitChord-/Bit-/' app/build.gradle.kts
          sed -i 's#repos/[A-Za-z0-9_-]*/[A-Za-z0-9_-]*/releases/latest#repos/${{ github.repository }}/releases/latest#' \
            app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt
          python3 - <<'PY'
          import os, re
          run = int(os.environ["RUN"])
          s = open("build.gradle.kts").read()
          m = re.search(r'(?:bitchordVersionName"\] = |baseVersion = )"([0-9.]+)"', s)
          ver = f"{m.group(1)}.{run}"
          s = re.sub(r'extra\["bitchordVersionCode"\][^\n]*', f'extra["bitchordVersionCode"] = {39 + run}', s)
          s = re.sub(r'extra\["bitchordVersionName"\] = [^\n]*(\n    if [^\n]*)?',
                     f'extra["bitchordVersionName"] = "{ver}"', s)
          open("build.gradle.kts", "w").write(s)
          open(os.environ["GITHUB_ENV"], "a").write(f"VER={ver}\n")
          PY

      # Neu repo co secret thi dung secret, khong thi dung key dev nhung san ben duoi.
      - name: Setup Secrets (Keystore & local.properties)
        env:
          S_LASTFM_KEY: ${{ secrets.LASTFM_API_KEY }}
          S_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          S_LISTEN: ${{ secrets.LISTEN_TOGETHER_SERVER }}
          S_KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "LASTFM_API_KEY=$S_LASTFM_KEY"
            echo "LASTFM_SECRET=$S_LASTFM_SECRET"
            echo "LISTEN_TOGETHER_SERVER=$S_LISTEN"
          } > local.properties
          KS_B64="$S_KS_B64"; KS_PASS="$S_KS_PASS"; KEY_ALIAS="$S_KEY_ALIAS"; KEY_PASS="$S_KEY_PASS"
          if [ -z "$KS_B64" ]; then
            KS_B64=''
            KS_PASS='M8rnSCC3C4TkChAh'
            KEY_ALIAS='bitdev'
            KEY_PASS='M8rnSCC3C4TkChAh'
          fi
          echo "$KS_B64" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - run: chmod +x gradlew
      - run: ./gradlew assembleDevRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/dev/release/*.apk | head -1)
          cp "$APK" "Bit-v${VER}_arm64-v8a.apk"
          gh release delete "v${VER}" --cleanup-tag --yes || true
          gh release create "v${VER}" "Bit-v${VER}_arm64-v8a.apk" \
            --target "$GITHUB_SHA" --title "Bit Dev v${VER}" \
            --notes "Build #${{ github.run_number }}"
